<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目后台管理</title>
  <style>
    :root {
      --bg: #eef2f7;
      --card: #ffffff;
      --ink: #18212f;
      --muted: #64748b;
      --line: #dbe3ef;
      --accent: #166534;
      --danger: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(180deg, #f8fafc 0%, var(--bg) 100%);
      color: var(--ink);
    }
    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 24px 60px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .topbar a {
      color: var(--muted);
      text-decoration: none;
      font-weight: 700;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 0.95fr;
      gap: 22px;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 18px 36px rgba(15, 23, 42, 0.05);
    }
    h1, h2 {
      margin-top: 0;
    }
    form {
      display: grid;
      gap: 14px;
    }
    label {
      display: grid;
      gap: 8px;
      font-weight: 700;
    }
    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      background: #fbfdff;
    }
    textarea {
      min-height: 140px;
      resize: vertical;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    button {
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .primary {
      background: var(--accent);
      color: white;
    }
    .secondary {
      background: #e2e8f0;
      color: var(--ink);
    }
    .danger {
      background: var(--danger);
      color: white;
    }
    .message {
      min-height: 24px;
      color: var(--muted);
    }
    .hint {
      margin: -4px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.6;
    }
    .upload-row {
      display: grid;
      gap: 10px;
      padding: 14px;
      border: 1px dashed var(--line);
      border-radius: 14px;
      background: #f8fafc;
    }
    .upload-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .upload-status {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.6;
    }
    .project-list {
      display: grid;
      gap: 14px;
    }
    .project-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      display: grid;
      gap: 10px;
    }
    .project-card h3 {
      margin: 0;
    }
    .project-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .meta-pill {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 999px;
      background: #eff6ff;
      color: #1d4ed8;
      font-weight: 700;
    }
    .project-card .card-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .project-card .card-actions button {
      padding: 10px 14px;
      border-radius: 10px;
    }
    @media (max-width: 860px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="topbar">
      <div>
        <h1>项目后台管理</h1>
        <p class="message" id="message">已进入后台，可以开始管理项目。</p>
      </div>
      <div class="topbar-actions">
        <a href="/projects">查看前台项目</a>
        <button class="secondary" type="button" id="logout-button">退出登录</button>
      </div>
    </div>

    <div class="grid">
      <section class="panel">
        <h2 id="form-title">新建项目</h2>
        <form id="project-form">
          <label>
            标题
            <input id="title" name="title" required>
          </label>
          <label>
            摘要
            <textarea id="summary" name="summary" required></textarea>
          </label>
          <label>
            封面图片链接（可粘贴外链，或用下方上传本地图片）
            <input id="coverImage" name="coverImage" type="url" required>
          </label>
          <div class="upload-row">
            <label>
              本地封面图片（可选，上传后自动填入上方链接）
              <input id="coverFile" name="coverFile" type="file" accept="image/*">
            </label>
            <div class="upload-actions">
              <button class="secondary" type="button" id="upload-cover-button">上传本地图片</button>
              <span id="cover-upload-status" class="upload-status">想用电脑里的图片做封面？选择文件后点击上传（≤ 8MB）。</span>
            </div>
            <img id="cover-preview" alt="封面预览" style="display:none;max-width:100%;border-radius:12px;border:1px solid var(--line);" />
          </div>
          <label>
            视频链接（可选）
            <input id="videoUrl" name="videoUrl" type="url" placeholder="支持 mp4 / webm 直链，或可嵌入视频链接">
          </label>
          <div class="upload-row">
            <label>
              本地视频文件（可选）
              <input id="videoFile" name="videoFile" type="file" accept="video/*">
            </label>
            <div class="upload-actions">
              <button class="secondary" type="button" id="upload-video-button">上传本地视频</button>
              <span id="upload-status" class="upload-status">如果你想直接使用电脑里的视频，请先选择文件再点击上传。</span>
            </div>
          </div>
          <p class="hint">如果填写视频链接，项目详情页会自动显示“项目演示视频”模块。</p>
          <label>
            正文内容（支持 HTML）
            <textarea id="content" name="content" required></textarea>
          </label>
          <div class="actions">
            <button class="primary" type="submit">保存项目</button>
            <button class="secondary" type="button" id="reset-button">重置表单</button>
          </div>
        </form>
      </section>

      <section class="panel">
        <h2>现有项目</h2>
        <div id="project-list" class="project-list">
          <div class="project-card"><p>正在加载项目...</p></div>
        </div>
      </section>
    </div>
  </main>

  <script>
    const API_BASE = "https://myblogbackend-njns.onrender.com";
    const AUTH_TOKEN_KEY = "adminToken";
    const form = document.getElementById("project-form");
    const message = document.getElementById("message");
    const projectList = document.getElementById("project-list");
    const formTitle = document.getElementById("form-title");
    const resetButton = document.getElementById("reset-button");
    const logoutButton = document.getElementById("logout-button");
    const uploadVideoButton = document.getElementById("upload-video-button");
    const uploadStatus = document.getElementById("upload-status");
    const uploadCoverButton = document.getElementById("upload-cover-button");
    const coverUploadStatus = document.getElementById("cover-upload-status");
    const coverPreview = document.getElementById("cover-preview");
    const coverImageInput = document.getElementById("coverImage");
    const DEFAULT_COVER_STATUS = "想用电脑里的图片做封面？选择文件后点击上传（≤ 8MB）。";
    let editingId = null;
    let authToken = localStorage.getItem(AUTH_TOKEN_KEY) || "";

    function setMessage(text, isError = false) {
      message.textContent = text;
      message.style.color = isError ? "#b91c1c" : "#64748b";
    }

    function escapeHtml(text) {
      return String(text ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function resetForm(statusText = "已进入后台，可以开始管理项目。") {
      editingId = null;
      form.reset();
      formTitle.textContent = "新建项目";
      uploadStatus.textContent = "如果你想直接使用电脑里的视频，请先选择文件再点击上传。";
      coverUploadStatus.textContent = DEFAULT_COVER_STATUS;
      showCoverPreview("");
      setMessage(statusText);
    }

    function redirectToLogin() {
      localStorage.removeItem(AUTH_TOKEN_KEY);
      window.location.href = "/admin-login";
    }

    async function authFetch(url, options = {}) {
      const headers = { ...(options.headers || {}) };
      if (authToken) {
        headers.Authorization = `Bearer ${authToken}`;
      }

      const response = await fetch(url, {
        ...options,
        headers
      });

      if (response.status === 401) {
        redirectToLogin();
        throw new Error("登录状态已失效，请重新登录。");
      }

      return response;
    }

    async function parseJsonResponse(response) {
      const raw = await response.text();
      try {
        return raw ? JSON.parse(raw) : {};
      } catch {
        throw new Error(`服务器返回异常（HTTP ${response.status}），后端可能未正常运行，请稍后重试。`);
      }
    }

    async function verifySession() {
      if (!authToken) {
        redirectToLogin();
        return false;
      }

      try {
        const response = await authFetch(`${API_BASE}/api/auth/verify`);
        return response.ok;
      } catch {
        redirectToLogin();
        return false;
      }
    }

    async function fetchProjects() {
      const response = await authFetch(`${API_BASE}/api/projects`);
      if (!response.ok) {
        throw new Error("加载项目失败。");
      }
      return parseJsonResponse(response);
    }

    async function fetchProject(id) {
      const response = await authFetch(`${API_BASE}/api/projects/${id}`);
      if (!response.ok) {
        throw new Error("加载项目详情失败。");
      }
      return parseJsonResponse(response);
    }

    async function renderProjects() {
      try {
        const projects = await fetchProjects();
        if (!projects.length) {
          projectList.innerHTML = "<div class='project-card'><p>还没有项目。</p></div>";
          return;
        }

        projectList.innerHTML = projects.map((project) => `
          <article class="project-card">
            <div class="meta-row">
              <span>${escapeHtml(project.date || "未设置日期")}</span>
              <span class="meta-pill">${project.videoUrl ? "含视频" : "无视频"}</span>
            </div>
            <h3>${escapeHtml(project.title)}</h3>
            <p>${escapeHtml(project.summary)}</p>
            <div class="card-actions">
              <button class="secondary" data-action="edit" data-id="${escapeHtml(project.id)}">编辑</button>
              <button class="danger" data-action="delete" data-id="${escapeHtml(project.id)}">删除</button>
            </div>
          </article>
        `).join("");
      } catch (error) {
        projectList.innerHTML = `<div class="project-card"><p>${error.message}</p></div>`;
      }
    }

    async function uploadSelectedVideo() {
      const fileInput = form.videoFile;
      const file = fileInput.files[0];
      if (!file) {
        throw new Error("请先选择一个本地视频文件。");
      }

      uploadStatus.textContent = `正在上传：${file.name}`;
      const formData = new FormData();
      formData.append("video", file);

      const response = await authFetch(`${API_BASE}/api/uploads/video`, {
        method: "POST",
        body: formData
      });

      const result = await parseJsonResponse(response);
      if (!response.ok) {
        throw new Error(result.message || "视频上传失败。");
      }

      form.videoUrl.value = result.videoUrl;
      uploadStatus.textContent = "视频上传成功，链接已自动填入。";
      return result.videoUrl;
    }

    function showCoverPreview(url) {
      if (url) {
        coverPreview.src = url;
        coverPreview.style.display = "block";
      } else {
        coverPreview.removeAttribute("src");
        coverPreview.style.display = "none";
      }
    }

    async function uploadSelectedImage() {
      const file = form.coverFile.files[0];
      if (!file) {
        throw new Error("请先选择一张本地图片。");
      }

      coverUploadStatus.textContent = `正在上传：${file.name}`;
      const formData = new FormData();
      formData.append("image", file);

      const response = await authFetch(`${API_BASE}/api/uploads/image`, {
        method: "POST",
        body: formData
      });

      const result = await parseJsonResponse(response);
      if (!response.ok) {
        throw new Error(result.message || "图片上传失败。");
      }

      form.coverImage.value = result.imageUrl;
      showCoverPreview(result.imageUrl);
      coverUploadStatus.textContent = "图片上传成功，链接已自动填入。";
      return result.imageUrl;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const payload = {
        title: form.title.value.trim(),
        summary: form.summary.value.trim(),
        coverImage: form.coverImage.value.trim(),
        videoUrl: form.videoUrl.value.trim(),
        content: form.content.value.trim()
      };

      const method = editingId ? "PUT" : "POST";
      const url = editingId ? `${API_BASE}/api/projects/${editingId}` : `${API_BASE}/api/projects`;

      try {
        const response = await authFetch(url, {
          method,
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const result = await parseJsonResponse(response);
        if (!response.ok) {
          throw new Error(result.message || "请求失败。");
        }

        resetForm(editingId ? "项目已更新。" : "项目已创建。");
        await renderProjects();
      } catch (error) {
        setMessage(error.message, true);
      }
    });

    resetButton.addEventListener("click", () => resetForm());
    uploadVideoButton.addEventListener("click", async () => {
      try {
        await uploadSelectedVideo();
      } catch (error) {
        uploadStatus.textContent = error.message;
        setMessage(error.message, true);
      }
    });

    uploadCoverButton.addEventListener("click", async () => {
      try {
        await uploadSelectedImage();
      } catch (error) {
        coverUploadStatus.textContent = error.message;
        setMessage(error.message, true);
      }
    });

    coverImageInput.addEventListener("input", () => showCoverPreview(coverImageInput.value.trim()));

    logoutButton.addEventListener("click", async () => {
      try {
        await authFetch(`${API_BASE}/api/auth/logout`, { method: "POST" });
      } catch {}
      redirectToLogin();
    });

    projectList.addEventListener("click", async (event) => {
      const button = event.target.closest("button");
      if (!button) return;

      const id = button.dataset.id;
      const action = button.dataset.action;

      if (action === "edit") {
        try {
          const project = await fetchProject(id);
          editingId = project.id;
          formTitle.textContent = "编辑项目";
          form.title.value = project.title;
          form.summary.value = project.summary;
          form.coverImage.value = project.coverImage;
          form.videoUrl.value = project.videoUrl || "";
          form.content.value = project.content;
          showCoverPreview(project.coverImage);
          coverUploadStatus.textContent = "当前封面已填入。你也可以重新上传本地图片覆盖它。";
          uploadStatus.textContent = project.videoUrl ? "当前项目已绑定视频链接。你也可以重新上传本地视频覆盖它。" : "当前项目还没有视频。";
          setMessage(`正在编辑《${project.title}》。`);
          window.scrollTo({ top: 0, behavior: "smooth" });
        } catch (error) {
          setMessage(error.message, true);
        }
      }

      if (action === "delete") {
        const confirmed = window.confirm("确定要删除这个项目吗？");
        if (!confirmed) return;

        try {
          const response = await authFetch(`${API_BASE}/api/projects/${id}`, { method: "DELETE" });
          const result = await parseJsonResponse(response);
          if (!response.ok) {
            throw new Error(result.message || "删除失败。");
          }
          if (editingId === id) {
            resetForm();
          }
          setMessage("项目已删除。");
          await renderProjects();
        } catch (error) {
          setMessage(error.message, true);
        }
      }
    });

    verifySession().then((ok) => {
      if (!ok) return;
      resetForm();
      renderProjects();
    });
  </script>
</body>
</html>
