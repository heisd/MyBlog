<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目后台管理</title>
  <style>
    :root {
      --bg: #eef2f7;
      --card: #ffffff;
      --ink: #18212f;
      --muted: #64748b;
      --line: #dbe3ef;
      --accent: #166534;
      --danger: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(180deg, #f8fafc 0%, var(--bg) 100%);
      color: var(--ink);
    }
    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 24px 60px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .topbar a {
      color: var(--muted);
      text-decoration: none;
      font-weight: 700;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 0.95fr;
      gap: 22px;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 18px 36px rgba(15, 23, 42, 0.05);
    }
    h1, h2 {
      margin-top: 0;
    }
    form {
      display: grid;
      gap: 14px;
    }
    label {
      display: grid;
      gap: 8px;
      font-weight: 700;
    }
    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      background: #fbfdff;
    }
    textarea {
      min-height: 140px;
      resize: vertical;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    button {
      position: relative;
      overflow: hidden;
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 150ms ease, box-shadow 150ms ease, filter 150ms ease, background-color 150ms ease;
      will-change: transform;
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.14);
      filter: brightness(1.05);
    }
    button:active {
      transform: translateY(0) scale(0.96);
      box-shadow: none;
      filter: brightness(0.97);
    }
    button:focus-visible {
      outline: 3px solid rgba(22, 101, 52, 0.4);
      outline-offset: 2px;
    }
    @media (prefers-reduced-motion: reduce) {
      button {
        transition: background-color 150ms ease;
      }
      button:hover,
      button:active {
        transform: none;
      }
      .primary {
        animation: none;
      }
      .ripple {
        display: none;
      }
    }
    .primary {
      background: linear-gradient(120deg, #166534, #1f8a4c, #0f4429, #166534);
      background-size: 300% 100%;
      color: white;
      animation: btn-flow 6s ease infinite;
    }
    .primary:hover {
      box-shadow: 0 10px 24px rgba(22, 101, 52, 0.4);
      animation-duration: 2.2s;
    }
    .secondary {
      background: #e2e8f0;
      color: var(--ink);
    }
    .danger {
      background: var(--danger);
      color: white;
    }
    @keyframes btn-flow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .ripple {
      position: absolute;
      border-radius: 50%;
      transform: scale(0);
      background: rgba(255, 255, 255, 0.5);
      animation: ripple-anim 600ms linear;
      pointer-events: none;
    }
    .secondary .ripple {
      background: rgba(15, 23, 42, 0.14);
    }
    @keyframes ripple-anim {
      to { transform: scale(4); opacity: 0; }
    }
    .message {
      min-height: 24px;
      color: var(--muted);
    }
    .hint {
      margin: -4px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.6;
    }
    .upload-row {
      display: grid;
      gap: 12px;
      padding: 18px;
      border: 1.5px dashed #c7d2e0;
      border-radius: 16px;
      background: linear-gradient(180deg, #fbfdff, #f4f7fb);
      transition: border-color 180ms ease, box-shadow 180ms ease;
    }
    .upload-row:hover {
      border-color: var(--accent);
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.06);
    }
    .upload-row > label {
      font-size: 0.95rem;
    }
    .upload-row input[type="file"] {
      font-size: 0.9rem;
      color: var(--muted);
      border: 1px solid var(--line);
      background: #fff;
      padding: 8px 10px;
    }
    .upload-row input[type="file"]::file-selector-button {
      margin-right: 12px;
      border: none;
      border-radius: 999px;
      padding: 9px 16px;
      background: #e9eef7;
      color: var(--accent);
      font-weight: 700;
      cursor: pointer;
      transition: background-color 150ms ease, transform 150ms ease;
    }
    .upload-row input[type="file"]::file-selector-button:hover {
      background: #d7e0ef;
      transform: translateY(-1px);
    }
    .upload-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    .upload-row button:not(.preview-remove) {
      background: #fff;
      color: var(--accent);
      border: 1.5px solid var(--accent);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .upload-row button:not(.preview-remove)::before {
      content: "↑";
      font-weight: 900;
    }
    .upload-row button:not(.preview-remove):hover {
      background: var(--accent);
      color: #fff;
    }
    .upload-status {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.6;
    }
    .preview-wrap {
      position: relative;
      display: inline-block;
      margin-top: 4px;
      max-width: 100%;
    }
    .preview-wrap img {
      display: block;
      max-width: 100%;
      border-radius: 12px;
      border: 1px solid var(--line);
    }
    .preview-wrap .preview-remove {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 30px;
      height: 30px;
      padding: 0;
      border-radius: 50%;
      border: 2px solid #fff;
      background: rgba(17, 24, 39, 0.62);
      color: #fff;
      font-size: 20px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.28);
    }
    .preview-wrap .preview-remove:hover {
      background: var(--danger);
    }
    .project-list {
      display: grid;
      gap: 14px;
    }
    .project-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      display: grid;
      gap: 10px;
    }
    .project-card h3 {
      margin: 0;
    }
    .project-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .meta-pill {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 999px;
      background: #eff6ff;
      color: #1d4ed8;
      font-weight: 700;
    }
    .project-card .card-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .project-card .card-actions button {
      padding: 10px 14px;
      border-radius: 10px;
    }
    @media (max-width: 860px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="topbar">
      <div>
        <h1>项目后台管理</h1>
        <p class="message" id="message">已进入后台，可以开始管理项目。</p>
      </div>
      <div class="topbar-actions">
        <a href="/projects">查看前台项目</a>
        <button class="secondary" type="button" id="logout-button">退出登录</button>
      </div>
    </div>

    <div class="grid">
      <section class="panel">
        <h2 id="form-title">新建项目</h2>
        <form id="project-form">
          <label>
            标题
            <input id="title" name="title" required>
          </label>
          <label>
            摘要
            <textarea id="summary" name="summary" required></textarea>
          </label>
          <label>
            封面图片链接（可粘贴外链，或用下方上传本地图片）
            <input id="coverImage" name="coverImage" type="url" required>
          </label>
          <div class="upload-row">
            <label>
              本地封面图片（可选，上传后自动填入上方链接）
              <input id="coverFile" name="coverFile" type="file" accept="image/*">
            </label>
            <div class="upload-actions">
              <button class="secondary" type="button" id="upload-cover-button">上传本地图片</button>
              <span id="cover-upload-status" class="upload-status">想用电脑里的图片做封面？选择文件后点击上传（≤ 8MB）。</span>
            </div>
            <div id="cover-preview-wrap" class="preview-wrap" style="display:none;">
              <img id="cover-preview" alt="封面预览">
              <button type="button" id="cover-remove" class="preview-remove" aria-label="删除封面图片" title="删除封面图片">×</button>
            </div>
          </div>
          <label>
            视频链接（可选）
            <input id="videoUrl" name="videoUrl" type="url" placeholder="支持 mp4 / webm 直链，或可嵌入视频链接">
          </label>
          <div class="upload-row">
            <label>
              本地视频文件（可选）
              <input id="videoFile" name="videoFile" type="file" accept="video/*">
            </label>
            <div class="upload-actions">
              <button class="secondary" type="button" id="upload-video-button">上传本地视频</button>
              <span id="upload-status" class="upload-status">如果你想直接使用电脑里的视频，请先选择文件再点击上传。</span>
            </div>
          </div>
          <p class="hint">如果填写视频链接，项目详情页会自动显示“项目演示视频”模块。</p>
          <label>
            正文内容（支持 HTML）
            <textarea id="content" name="content" required></textarea>
          </label>
          <div class="upload-row">
            <label>
              导入文档（.md / .markdown / .txt / .docx / .pdf）
              <input id="docFile" name="docFile" type="file" accept=".md,.markdown,.txt,.docx,.pdf">
            </label>
            <div class="upload-actions">
              <button class="secondary" type="button" id="import-doc-button">导入文档到正文</button>
              <span id="doc-import-status" class="upload-status">上传文档会自动解析为正文 HTML，并提取目录、尝试填入标题/摘要（≤ 15MB，已填的标题/摘要不会被覆盖）。</span>
            </div>
          </div>
          <div class="upload-row">
            <label>
              正文插图（可多选，上传后在光标处依次插入 &lt;img&gt;）
              <input id="contentImageFile" name="contentImageFile" type="file" accept="image/*" multiple>
            </label>
            <div class="upload-actions">
              <button class="secondary" type="button" id="upload-content-image-button">上传图片插入正文</button>
              <span id="content-image-status" class="upload-status">先把光标放到正文里想插入的位置，选择一张或多张图片后点这里（每张 ≤ 8MB）。</span>
            </div>
          </div>
          <div class="actions">
            <button class="primary" type="submit">保存项目</button>
            <button class="secondary" type="button" id="reset-button">重置表单</button>
          </div>
        </form>
      </section>

      <section class="panel">
        <h2>现有项目</h2>
        <div id="project-list" class="project-list">
          <div class="project-card"><p>正在加载项目...</p></div>
        </div>
      </section>
    </div>
  </main>

  <script>
    const API_BASE = "https://myblogbackend-njns.onrender.com";
    const AUTH_TOKEN_KEY = "adminToken";
    const form = document.getElementById("project-form");
    const message = document.getElementById("message");
    const projectList = document.getElementById("project-list");
    const formTitle = document.getElementById("form-title");
    const resetButton = document.getElementById("reset-button");
    const logoutButton = document.getElementById("logout-button");
    const uploadVideoButton = document.getElementById("upload-video-button");
    const uploadStatus = document.getElementById("upload-status");
    const uploadCoverButton = document.getElementById("upload-cover-button");
    const coverUploadStatus = document.getElementById("cover-upload-status");
    const coverPreview = document.getElementById("cover-preview");
    const coverPreviewWrap = document.getElementById("cover-preview-wrap");
    const coverRemove = document.getElementById("cover-remove");
    const coverImageInput = document.getElementById("coverImage");
    const uploadContentImageButton = document.getElementById("upload-content-image-button");
    const contentImageStatus = document.getElementById("content-image-status");
    const importDocButton = document.getElementById("import-doc-button");
    const docImportStatus = document.getElementById("doc-import-status");
    const DEFAULT_DOC_STATUS = "上传文档会自动解析为正文 HTML，并提取目录、尝试填入标题/摘要（≤ 15MB，已填的标题/摘要不会被覆盖）。";
    const DEFAULT_COVER_STATUS = "想用电脑里的图片做封面？选择文件后点击上传（≤ 8MB）。";
    const DEFAULT_CONTENT_IMAGE_STATUS = "先把光标放到正文里想插入的位置，选择一张或多张图片后点这里（每张 ≤ 8MB）。";
    let editingId = null;
    let authToken = localStorage.getItem(AUTH_TOKEN_KEY) || "";

    function setMessage(text, isError = false) {
      message.textContent = text;
      message.style.color = isError ? "#b91c1c" : "#64748b";
    }

    function escapeHtml(text) {
      return String(text ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function resetForm(statusText = "已进入后台，可以开始管理项目。") {
      editingId = null;
      form.reset();
      formTitle.textContent = "新建项目";
      uploadStatus.textContent = "如果你想直接使用电脑里的视频，请先选择文件再点击上传。";
      coverUploadStatus.textContent = DEFAULT_COVER_STATUS;
      contentImageStatus.textContent = DEFAULT_CONTENT_IMAGE_STATUS;
      docImportStatus.textContent = DEFAULT_DOC_STATUS;
      showCoverPreview("");
      setMessage(statusText);
    }

    function redirectToLogin() {
      localStorage.removeItem(AUTH_TOKEN_KEY);
      window.location.href = "/admin-login";
    }

    async function authFetch(url, options = {}) {
      const headers = { ...(options.headers || {}) };
      if (authToken) {
        headers.Authorization = `Bearer ${authToken}`;
      }

      const response = await fetch(url, {
        ...options,
        headers
      });

      if (response.status === 401) {
        redirectToLogin();
        throw new Error("登录状态已失效，请重新登录。");
      }

      return response;
    }

    async function parseJsonResponse(response) {
      const raw = await response.text();
      try {
        return raw ? JSON.parse(raw) : {};
      } catch {
        throw new Error(`服务器返回异常（HTTP ${response.status}），后端可能未正常运行，请稍后重试。`);
      }
    }

    async function verifySession() {
      if (!authToken) {
        redirectToLogin();
        return false;
      }

      try {
        const response = await authFetch(`${API_BASE}/api/auth/verify`);
        return response.ok;
      } catch {
        redirectToLogin();
        return false;
      }
    }

    async function fetchProjects() {
      const response = await authFetch(`${API_BASE}/api/projects`);
      if (!response.ok) {
        throw new Error("加载项目失败。");
      }
      return parseJsonResponse(response);
    }

    async function fetchProject(id) {
      const response = await authFetch(`${API_BASE}/api/projects/${id}`);
      if (!response.ok) {
        throw new Error("加载项目详情失败。");
      }
      return parseJsonResponse(response);
    }

    async function renderProjects() {
      try {
        const projects = await fetchProjects();
        if (!projects.length) {
          projectList.innerHTML = "<div class='project-card'><p>还没有项目。</p></div>";
          return;
        }

        projectList.innerHTML = projects.map((project) => `
          <article class="project-card">
            <div class="meta-row">
              <span>${escapeHtml(project.date || "未设置日期")}</span>
              <span class="meta-pill">${project.videoUrl ? "含视频" : "无视频"}</span>
            </div>
            <h3>${escapeHtml(project.title)}</h3>
            <p>${escapeHtml(project.summary)}</p>
            <div class="card-actions">
              <button class="secondary" data-action="edit" data-id="${escapeHtml(project.id)}">编辑</button>
              <button class="danger" data-action="delete" data-id="${escapeHtml(project.id)}">删除</button>
            </div>
          </article>
        `).join("");
      } catch (error) {
        projectList.innerHTML = `<div class="project-card"><p>${error.message}</p></div>`;
      }
    }

    async function uploadSelectedVideo() {
      const fileInput = form.videoFile;
      const file = fileInput.files[0];
      if (!file) {
        throw new Error("请先选择一个本地视频文件。");
      }

      uploadStatus.textContent = `正在上传：${file.name}`;
      const formData = new FormData();
      formData.append("video", file);

      const response = await authFetch(`${API_BASE}/api/uploads/video`, {
        method: "POST",
        body: formData
      });

      const result = await parseJsonResponse(response);
      if (!response.ok) {
        throw new Error(result.message || "视频上传失败。");
      }

      form.videoUrl.value = result.videoUrl;
      uploadStatus.textContent = "视频上传成功，链接已自动填入。";
      return result.videoUrl;
    }

    function showCoverPreview(url) {
      if (url) {
        coverPreview.src = url;
        coverPreviewWrap.style.display = "inline-block";
      } else {
        coverPreview.removeAttribute("src");
        coverPreviewWrap.style.display = "none";
      }
    }

    async function uploadSelectedImage() {
      const file = form.coverFile.files[0];
      if (!file) {
        throw new Error("请先选择一张本地图片。");
      }

      coverUploadStatus.textContent = `正在上传：${file.name}`;
      const formData = new FormData();
      formData.append("image", file);

      const response = await authFetch(`${API_BASE}/api/uploads/image`, {
        method: "POST",
        body: formData
      });

      const result = await parseJsonResponse(response);
      if (!response.ok) {
        throw new Error(result.message || "图片上传失败。");
      }

      form.coverImage.value = result.imageUrl;
      showCoverPreview(result.imageUrl);
      coverUploadStatus.textContent = "图片上传成功，链接已自动填入。";
      return result.imageUrl;
    }

    function insertIntoContent(snippet) {
      const textarea = form.content;
      const start = textarea.selectionStart ?? textarea.value.length;
      const end = textarea.selectionEnd ?? textarea.value.length;
      textarea.value = textarea.value.slice(0, start) + snippet + textarea.value.slice(end);
      const caret = start + snippet.length;
      textarea.focus();
      textarea.setSelectionRange(caret, caret);
    }

    async function uploadContentImage() {
      const files = Array.from(form.contentImageFile.files || []);
      if (!files.length) {
        throw new Error("请先选择图片（可多选）。");
      }

      let done = 0;
      for (const file of files) {
        contentImageStatus.textContent = `正在上传（${done + 1}/${files.length}）：${file.name}`;
        const formData = new FormData();
        formData.append("image", file);

        const response = await authFetch(`${API_BASE}/api/uploads/image`, {
          method: "POST",
          body: formData
        });

        const result = await parseJsonResponse(response);
        if (!response.ok) {
          throw new Error(result.message || `「${file.name}」上传失败。`);
        }

        const snippet = `\n<img src="${escapeHtml(result.imageUrl)}" alt="" style="max-width:100%;border-radius:8px;" />\n`;
        insertIntoContent(snippet);
        done += 1;
      }

      contentImageStatus.textContent = `已上传并插入 ${done} 张图片。`;
      form.contentImageFile.value = "";
    }

    async function importDocument() {
      const file = form.docFile.files[0];
      if (!file) {
        throw new Error("请先选择一个文档文件（.md / .docx / .pdf 等）。");
      }

      docImportStatus.textContent = `正在解析：${file.name}`;
      const formData = new FormData();
      formData.append("document", file);

      const response = await authFetch(`${API_BASE}/api/uploads/document`, {
        method: "POST",
        body: formData
      });

      const result = await parseJsonResponse(response);
      if (!response.ok) {
        throw new Error(result.message || "文档解析失败。");
      }

      insertIntoContent(result.html || "");

      const filled = [];
      if (result.title && !form.title.value.trim()) {
        form.title.value = result.title;
        filled.push("标题");
      }
      if (result.summary && !form.summary.value.trim()) {
        form.summary.value = result.summary;
        filled.push("摘要");
      }

      const headings = (result.outline || []).length;
      docImportStatus.textContent = `已导入正文${headings ? `（识别 ${headings} 个标题/目录）` : ""}${filled.length ? `，并自动填入${filled.join("、")}` : ""}。请检查后保存。`;
      form.docFile.value = "";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const payload = {
        title: form.title.value.trim(),
        summary: form.summary.value.trim(),
        coverImage: form.coverImage.value.trim(),
        videoUrl: form.videoUrl.value.trim(),
        content: form.content.value.trim()
      };

      const method = editingId ? "PUT" : "POST";
      const url = editingId ? `${API_BASE}/api/projects/${editingId}` : `${API_BASE}/api/projects`;

      try {
        const response = await authFetch(url, {
          method,
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const result = await parseJsonResponse(response);
        if (!response.ok) {
          throw new Error(result.message || "请求失败。");
        }

        resetForm(editingId ? "项目已更新。" : "项目已创建。");
        await renderProjects();
      } catch (error) {
        setMessage(error.message, true);
      }
    });

    resetButton.addEventListener("click", () => resetForm());
    uploadVideoButton.addEventListener("click", async () => {
      try {
        await uploadSelectedVideo();
      } catch (error) {
        uploadStatus.textContent = error.message;
        setMessage(error.message, true);
      }
    });

    uploadCoverButton.addEventListener("click", async () => {
      try {
        await uploadSelectedImage();
      } catch (error) {
        coverUploadStatus.textContent = error.message;
        setMessage(error.message, true);
      }
    });

    coverImageInput.addEventListener("input", () => showCoverPreview(coverImageInput.value.trim()));

    coverRemove.addEventListener("click", () => {
      form.coverImage.value = "";
      form.coverFile.value = "";
      showCoverPreview("");
      coverUploadStatus.textContent = DEFAULT_COVER_STATUS;
      setMessage("已移除封面图片，可重新上传或粘贴链接。");
    });

    uploadContentImageButton.addEventListener("click", async () => {
      try {
        await uploadContentImage();
      } catch (error) {
        contentImageStatus.textContent = error.message;
        setMessage(error.message, true);
      }
    });

    importDocButton.addEventListener("click", async () => {
      try {
        await importDocument();
      } catch (error) {
        docImportStatus.textContent = error.message;
        setMessage(error.message, true);
      }
    });

    logoutButton.addEventListener("click", async () => {
      try {
        await authFetch(`${API_BASE}/api/auth/logout`, { method: "POST" });
      } catch {}
      redirectToLogin();
    });

    projectList.addEventListener("click", async (event) => {
      const button = event.target.closest("button");
      if (!button) return;

      const id = button.dataset.id;
      const action = button.dataset.action;

      if (action === "edit") {
        try {
          const project = await fetchProject(id);
          editingId = project.id;
          formTitle.textContent = "编辑项目";
          form.title.value = project.title;
          form.summary.value = project.summary;
          form.coverImage.value = project.coverImage;
          form.videoUrl.value = project.videoUrl || "";
          form.content.value = project.content;
          showCoverPreview(project.coverImage);
          coverUploadStatus.textContent = "当前封面已填入。你也可以重新上传本地图片覆盖它。";
          uploadStatus.textContent = project.videoUrl ? "当前项目已绑定视频链接。你也可以重新上传本地视频覆盖它。" : "当前项目还没有视频。";
          setMessage(`正在编辑《${project.title}》。`);
          window.scrollTo({ top: 0, behavior: "smooth" });
        } catch (error) {
          setMessage(error.message, true);
        }
      }

      if (action === "delete") {
        const confirmed = window.confirm("确定要删除这个项目吗？");
        if (!confirmed) return;

        try {
          const response = await authFetch(`${API_BASE}/api/projects/${id}`, { method: "DELETE" });
          const result = await parseJsonResponse(response);
          if (!response.ok) {
            throw new Error(result.message || "删除失败。");
          }
          if (editingId === id) {
            resetForm();
          }
          setMessage("项目已删除。");
          await renderProjects();
        } catch (error) {
          setMessage(error.message, true);
        }
      }
    });

    verifySession().then((ok) => {
      if (!ok) return;
      resetForm();
      renderProjects();
    });

    (function () {
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      document.addEventListener("click", function (event) {
        const target = event.target.closest("button");
        if (!target) return;
        const rect = target.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        const ripple = document.createElement("span");
        ripple.className = "ripple";
        ripple.style.width = ripple.style.height = `${size}px`;
        ripple.style.left = `${event.clientX - rect.left - size / 2}px`;
        ripple.style.top = `${event.clientY - rect.top - size / 2}px`;
        target.appendChild(ripple);
        ripple.addEventListener("animationend", function () { ripple.remove(); });
      });
    })();
  </script>
</body>
</html>
