<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目后台管理</title>
  <style>
    :root {
      --bg: #eef2f7;
      --card: #ffffff;
      --ink: #18212f;
      --muted: #64748b;
      --line: #dbe3ef;
      --accent: #166534;
      --danger: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(180deg, #f8fafc 0%, var(--bg) 100%);
      color: var(--ink);
    }
    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 24px 60px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .topbar a {
      color: var(--muted);
      text-decoration: none;
      font-weight: 700;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 18px 36px rgba(15, 23, 42, 0.05);
    }
    .panel + .panel { margin-top: 22px; }
    h1, h2 { margin-top: 0; }
    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .panel-head h2 { margin: 0; }
    button {
      position: relative;
      overflow: hidden;
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 150ms ease, box-shadow 150ms ease, filter 150ms ease, background-color 150ms ease;
      will-change: transform;
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.14);
      filter: brightness(1.05);
    }
    button:active {
      transform: translateY(0) scale(0.96);
      box-shadow: none;
      filter: brightness(0.97);
    }
    button:focus-visible {
      outline: 3px solid rgba(22, 101, 52, 0.4);
      outline-offset: 2px;
    }
    .btn-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      border-radius: 999px;
      padding: 12px 20px;
      font-weight: 700;
      transition: transform 150ms ease, box-shadow 150ms ease, filter 150ms ease;
    }
    .btn-link:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(22, 101, 52, 0.4); }
    .btn-link:active { transform: translateY(0) scale(0.97); }
    @media (prefers-reduced-motion: reduce) {
      button { transition: background-color 150ms ease; }
      button:hover, button:active { transform: none; }
      .primary { animation: none; }
      .ripple { display: none; }
    }
    .primary {
      background: linear-gradient(120deg, #166534, #1f8a4c, #0f4429, #166534);
      background-size: 300% 100%;
      color: white;
      animation: btn-flow 6s ease infinite;
    }
    .primary:hover {
      box-shadow: 0 10px 24px rgba(22, 101, 52, 0.4);
      animation-duration: 2.2s;
    }
    .secondary {
      background: #e2e8f0;
      color: var(--ink);
    }
    .danger {
      background: var(--danger);
      color: white;
    }
    @keyframes btn-flow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .ripple {
      position: absolute;
      border-radius: 50%;
      transform: scale(0);
      background: rgba(255, 255, 255, 0.5);
      animation: ripple-anim 600ms linear;
      pointer-events: none;
    }
    .secondary .ripple { background: rgba(15, 23, 42, 0.14); }
    @keyframes ripple-anim { to { transform: scale(4); opacity: 0; } }
    .message {
      min-height: 24px;
      color: var(--muted);
    }
    .hint {
      margin: -4px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.6;
    }
    .new-article {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .new-article .na-text h2 { margin: 0 0 4px; }
    .new-article .na-text p { margin: 0; color: var(--muted); line-height: 1.6; }
    .project-list {
      display: grid;
      gap: 14px;
    }
    .project-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      display: grid;
      gap: 10px;
      animation: pcard-in 360ms ease backwards;
      transition: box-shadow 180ms ease, border-color 180ms ease;
    }
    .project-card h3 { margin: 0; }
    .project-card p { margin: 0; color: var(--muted); line-height: 1.7; }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .meta-pill {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 999px;
      background: #eff6ff;
      color: #1d4ed8;
      font-weight: 700;
    }
    .project-card .card-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .project-card .card-actions button,
    .project-card .card-actions a {
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
    @keyframes pcard-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    .project-card.pinned {
      border-color: rgba(22, 101, 52, 0.5);
      box-shadow: inset 4px 0 0 var(--accent), 0 18px 36px rgba(15, 23, 42, 0.05);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }
    .badge-pin { background: #fde9d3; color: #b45309; }
    .badge-draft { background: #e2e8f0; color: #475569; }
    .badge-pub { background: #dcfce7; color: #166534; }
    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .ctag {
      display: inline-flex;
      padding: 3px 10px;
      border-radius: 999px;
      background: #eef2f7;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 700;
    }
    .admin-filters {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }
    .afilter {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .afilter .label { color: var(--muted); font-size: 0.85rem; }
    .afilter button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 14px;
      font: inherit;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: transform 150ms ease, border-color 150ms ease, color 150ms ease, background-color 150ms ease;
    }
    .afilter button:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
    .afilter button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .visitor-add {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin: 4px 0 2px;
    }
    .visitor-add input[type="email"] {
      flex: 1 1 240px;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      background: #fbfdff;
    }
    .visitor-add select {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      background: #fbfdff;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="topbar">
      <div>
        <h1>项目后台管理</h1>
        <p class="message" id="message">已进入后台，可以开始管理项目。</p>
      </div>
      <div class="topbar-actions">
        <a href="/projects">查看前台项目</a>
        <button class="secondary" type="button" id="logout-button">退出登录</button>
      </div>
    </div>

    <section class="panel new-article">
      <div class="na-text">
        <h2>写文章</h2>
        <p>点击进入全屏编辑器：左侧写正文、右侧实时预览，其余设置在右侧侧边栏。</p>
      </div>
      <a class="btn-link primary" href="/editor">＋ 新建文章</a>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>现有项目</h2>
      </div>
      <div class="admin-filters" id="admin-filters" style="display:none;">
        <div class="afilter" id="status-filter"><span class="label">状态</span></div>
        <div class="afilter" id="tag-filter"><span class="label">标签</span></div>
      </div>
      <div id="project-list" class="project-list">
        <div class="project-card"><p>正在加载项目...</p></div>
      </div>
    </section>

    <section class="panel">
      <h2>会员管理</h2>
      <p class="hint">会员（订阅制 · 按月）可查看项目的私有 GitHub 链接、使用 AI 助手。管理员账号本身已拥有全部会员权限。点「+1 个月」授予或续费，点「取消会员」仅取消资格（保留账号），点「删除」彻底移除账号。</p>
      <div class="visitor-add">
        <input type="email" id="visitor-add-email" placeholder="手动添加会员：输入邮箱" autocomplete="off" />
        <select id="visitor-add-months" aria-label="会员月数">
          <option value="1">1 个月</option>
          <option value="3">3 个月</option>
          <option value="6">6 个月</option>
          <option value="12">12 个月</option>
        </select>
        <button type="button" class="primary" id="visitor-add-btn">添加为会员</button>
      </div>
      <p class="hint" style="margin:6px 0 14px;">手动添加的邮箱若尚未注册，会先建立一个「待认领」会员账号；本人用该邮箱注册并设置密码后即可登录，会员有效期保留。</p>
      <div id="visitor-list" class="project-list">
        <div class="project-card"><p>正在加载…</p></div>
      </div>
    </section>
  </main>

  <script>
    const API_BASE = "https://myblogbackend-njns.onrender.com";
    const AUTH_TOKEN_KEY = "adminToken";
    const message = document.getElementById("message");
    const projectList = document.getElementById("project-list");
    const logoutButton = document.getElementById("logout-button");
    const adminFilters = document.getElementById("admin-filters");
    const statusFilter = document.getElementById("status-filter");
    const tagFilter = document.getElementById("tag-filter");
    let allAdminProjects = [];
    let adminFilterStatus = "全部";
    let adminFilterTag = "全部";
    let authToken = localStorage.getItem(AUTH_TOKEN_KEY) || "";

    function setMessage(text, isError = false) {
      message.textContent = text;
      message.style.color = isError ? "#b91c1c" : "#64748b";
    }

    function escapeHtml(text) {
      return String(text ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function redirectToLogin() {
      localStorage.removeItem(AUTH_TOKEN_KEY);
      window.location.href = "/admin-login";
    }

    async function authFetch(url, options = {}) {
      const headers = { ...(options.headers || {}) };
      if (authToken) {
        headers.Authorization = `Bearer ${authToken}`;
      }
      const response = await fetch(url, { ...options, headers });
      if (response.status === 401) {
        redirectToLogin();
        throw new Error("登录状态已失效，请重新登录。");
      }
      return response;
    }

    async function parseJsonResponse(response) {
      const raw = await response.text();
      try {
        return raw ? JSON.parse(raw) : {};
      } catch {
        throw new Error(`服务器返回异常（HTTP ${response.status}），后端可能未正常运行，请稍后重试。`);
      }
    }

    async function verifySession() {
      if (!authToken) {
        redirectToLogin();
        return false;
      }
      try {
        const response = await authFetch(`${API_BASE}/api/auth/verify`);
        return response.ok;
      } catch {
        redirectToLogin();
        return false;
      }
    }

    async function loadAdminProjects() {
      try {
        const response = await authFetch(`${API_BASE}/api/admin/projects`);
        if (!response.ok) {
          throw new Error("加载项目失败。");
        }
        allAdminProjects = await parseJsonResponse(response);
        buildAdminFilters();
        adminFilters.style.display = allAdminProjects.length ? "flex" : "none";
        renderProjects();
      } catch (error) {
        projectList.innerHTML = `<div class="project-card"><p>${escapeHtml(error.message)}</p></div>`;
      }
    }

    function buildAdminFilters() {
      const statuses = [
        { key: "全部", label: "全部" },
        { key: "published", label: "已发布" },
        { key: "draft", label: "草稿" },
      ];
      statusFilter.innerHTML =
        '<span class="label">状态</span>' +
        statuses
          .map(
            (s) =>
              `<button type="button" data-status="${s.key}" class="${s.key === adminFilterStatus ? "active" : ""}">${s.label}</button>`
          )
          .join("");

      const tagSet = new Set();
      allAdminProjects.forEach((p) => (p.tags || []).forEach((t) => tagSet.add(t)));
      const tags = ["全部", ...Array.from(tagSet).sort((a, b) => a.localeCompare(b, "zh"))];
      tagFilter.innerHTML =
        '<span class="label">标签</span>' +
        tags
          .map(
            (t) =>
              `<button type="button" data-tag="${escapeHtml(t)}" class="${t === adminFilterTag ? "active" : ""}">${escapeHtml(t)}</button>`
          )
          .join("");
    }

    function renderProjects() {
      const filtered = allAdminProjects.filter((p) => {
        const okStatus = adminFilterStatus === "全部" || (p.status || "published") === adminFilterStatus;
        const okTag = adminFilterTag === "全部" || (p.tags || []).includes(adminFilterTag);
        return okStatus && okTag;
      });

      if (!filtered.length) {
        projectList.innerHTML = "<div class='project-card'><p>没有匹配的项目。</p></div>";
        return;
      }

      projectList.innerHTML = filtered
        .map((project) => {
          const isDraftP = (project.status || "published") === "draft";
          const tags = Array.isArray(project.tags) ? project.tags : [];
          return `
          <article class="project-card${project.pinned ? " pinned" : ""}">
            <div class="meta-row">
              <span>${escapeHtml(project.date || "未设置日期")}</span>
              ${project.pinned ? '<span class="badge badge-pin">置顶</span>' : ""}
              <span class="badge ${isDraftP ? "badge-draft" : "badge-pub"}">${isDraftP ? "草稿" : "已发布"}</span>
              <span class="meta-pill">${project.videoUrl ? "含视频" : "无视频"}</span>
            </div>
            <h3>${escapeHtml(project.title)}</h3>
            <p>${escapeHtml(project.summary)}</p>
            ${tags.length ? `<div class="card-tags">${tags.map((t) => `<span class="ctag">${escapeHtml(t)}</span>`).join("")}</div>` : ""}
            <div class="card-actions">
              <button class="secondary" data-action="pin" data-id="${escapeHtml(project.id)}">${project.pinned ? "取消置顶" : "置顶"}</button>
              <button class="secondary" data-action="status" data-id="${escapeHtml(project.id)}">${isDraftP ? "发布" : "转草稿"}</button>
              <a class="secondary" href="/editor?id=${encodeURIComponent(project.id)}">编辑</a>
              <button class="danger" data-action="delete" data-id="${escapeHtml(project.id)}">删除</button>
            </div>
          </article>`;
        })
        .join("");
    }

    statusFilter.addEventListener("click", (event) => {
      const btn = event.target.closest("button[data-status]");
      if (!btn) return;
      adminFilterStatus = btn.dataset.status;
      buildAdminFilters();
      renderProjects();
    });

    tagFilter.addEventListener("click", (event) => {
      const btn = event.target.closest("button[data-tag]");
      if (!btn) return;
      adminFilterTag = btn.dataset.tag;
      buildAdminFilters();
      renderProjects();
    });

    logoutButton.addEventListener("click", async () => {
      try {
        await authFetch(`${API_BASE}/api/auth/logout`, { method: "POST" });
      } catch {}
      redirectToLogin();
    });

    projectList.addEventListener("click", async (event) => {
      const button = event.target.closest("button");
      if (!button) return;

      const id = button.dataset.id;
      const action = button.dataset.action;

      if (action === "pin" || action === "status") {
        const project = allAdminProjects.find((p) => p.id === id);
        if (!project) return;
        const body =
          action === "pin"
            ? { pinned: !project.pinned }
            : { status: (project.status || "published") === "draft" ? "published" : "draft" };
        try {
          const response = await authFetch(`${API_BASE}/api/projects/${id}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
          });
          const result = await parseJsonResponse(response);
          if (!response.ok) {
            throw new Error(result.message || "操作失败。");
          }
          setMessage(
            action === "pin"
              ? (body.pinned ? "已置顶。" : "已取消置顶。")
              : (body.status === "draft" ? "已转为草稿。" : "已发布。")
          );
          await loadAdminProjects();
        } catch (error) {
          setMessage(error.message, true);
        }
      }

      if (action === "delete") {
        const confirmed = window.confirm("确定要删除这个项目吗？");
        if (!confirmed) return;

        try {
          const response = await authFetch(`${API_BASE}/api/projects/${id}`, { method: "DELETE" });
          const result = await parseJsonResponse(response);
          if (!response.ok) {
            throw new Error(result.message || "删除失败。");
          }
          setMessage("项目已删除。");
          await loadAdminProjects();
        } catch (error) {
          setMessage(error.message, true);
        }
      }
    });

    const visitorList = document.getElementById("visitor-list");

    function fmtDate(iso) {
      if (!iso) return "—";
      const d = new Date(iso);
      return Number.isNaN(d.getTime()) ? "—" : d.toLocaleDateString("zh-CN");
    }

    async function loadVisitors() {
      try {
        const response = await authFetch(`${API_BASE}/api/admin/visitors`);
        if (!response.ok) throw new Error("加载会员失败。");
        const list = await parseJsonResponse(response);
        if (!list.length) {
          visitorList.innerHTML = "<div class='project-card'><p>还没有注册用户。</p></div>";
          return;
        }
        visitorList.innerHTML = list
          .map(
            (v) => `
          <article class="project-card${v.member ? " pinned" : ""}">
            <div class="meta-row">
              <span>${escapeHtml(v.email)}</span>
              <span class="badge ${v.member ? "badge-pub" : "badge-draft"}">${v.member ? "会员" : "普通"}</span>
              ${v.pending ? `<span class="badge badge-draft">待认领</span>` : ""}
            </div>
            <p>${v.pending ? "管理员添加 · 本人尚未注册" : `注册：${fmtDate(v.createdAt)}`}${v.memberUntil ? ` · 会员到期：${fmtDate(v.memberUntil)}` : ""}</p>
            <div class="card-actions">
              <button class="secondary" data-vaction="extend" data-email="${escapeHtml(v.email)}">+1 个月</button>
              ${v.member ? `<button class="danger" data-vaction="revoke" data-email="${escapeHtml(v.email)}">取消会员</button>` : ""}
              <button class="danger" data-vaction="delete" data-email="${escapeHtml(v.email)}">删除</button>
            </div>
          </article>`
          )
          .join("");
      } catch (error) {
        visitorList.innerHTML = `<div class='project-card'><p>${escapeHtml(error.message)}</p></div>`;
      }
    }

    visitorList.addEventListener("click", async (event) => {
      const btn = event.target.closest("button[data-vaction]");
      if (!btn) return;
      const email = btn.dataset.email;
      const action = btn.dataset.vaction;
      try {
        if (action === "delete") {
          if (!confirm(`确定彻底删除会员账号「${email}」吗？该邮箱可重新注册。`)) return;
          const response = await authFetch(`${API_BASE}/api/admin/visitors/${encodeURIComponent(email)}`, {
            method: "DELETE",
          });
          const result = await parseJsonResponse(response);
          if (!response.ok) throw new Error(result.message || "删除失败。");
          setMessage("已删除会员账号。");
          await loadVisitors();
          return;
        }
        const body = action === "revoke" ? { revoke: true } : { extendMonths: 1 };
        const response = await authFetch(`${API_BASE}/api/admin/visitors/${encodeURIComponent(email)}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const result = await parseJsonResponse(response);
        if (!response.ok) throw new Error(result.message || "操作失败。");
        setMessage(action === "revoke" ? "已取消会员。" : "已授予 / 续费 1 个月会员。");
        await loadVisitors();
      } catch (error) {
        setMessage(error.message, true);
      }
    });

    // 手动添加会员（邮箱可未注册）
    document.getElementById("visitor-add-btn").addEventListener("click", async () => {
      const emailEl = document.getElementById("visitor-add-email");
      const email = (emailEl.value || "").trim().toLowerCase();
      const months = Number(document.getElementById("visitor-add-months").value) || 1;
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
        setMessage("请输入正确的邮箱。", true);
        return;
      }
      try {
        const response = await authFetch(`${API_BASE}/api/admin/visitors/${encodeURIComponent(email)}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ extendMonths: months }),
        });
        const result = await parseJsonResponse(response);
        if (!response.ok) throw new Error(result.message || "添加失败。");
        emailEl.value = "";
        setMessage(result.pending ? `已添加待认领会员（${months} 个月）。` : `已授予 / 续费 ${months} 个月会员。`);
        await loadVisitors();
      } catch (error) {
        setMessage(error.message, true);
      }
    });

    verifySession().then((ok) => {
      if (!ok) return;
      loadAdminProjects();
      loadVisitors();
    });

    (function () {
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      document.addEventListener("click", function (event) {
        const target = event.target.closest("button");
        if (!target) return;
        const rect = target.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        const ripple = document.createElement("span");
        ripple.className = "ripple";
        ripple.style.width = ripple.style.height = `${size}px`;
        ripple.style.left = `${event.clientX - rect.left - size / 2}px`;
        ripple.style.top = `${event.clientY - rect.top - size / 2}px`;
        target.appendChild(ripple);
        ripple.addEventListener("animationend", function () { ripple.remove(); });
      });
    })();
  </script>
</body>
</html>
