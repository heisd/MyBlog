<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>后台登录</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --card: rgba(255, 252, 246, 0.95);
      --ink: #1f2328;
      --muted: #6b7280;
      --line: #e5dccf;
      --accent: #9f4716;
      --accent-dark: #7c3410;
      --danger: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(159, 71, 22, 0.18), transparent 26%),
        linear-gradient(180deg, #fbf7f1 0%, var(--bg) 100%);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(460px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 26px;
      padding: 30px;
      box-shadow: 0 24px 60px rgba(53, 41, 30, 0.08);
    }
    .eyebrow {
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent-dark);
      font-size: 12px;
      margin-bottom: 12px;
      font-weight: 700;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 2rem;
    }
    p {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.7;
    }
    form {
      display: grid;
      gap: 14px;
    }
    label {
      display: grid;
      gap: 8px;
      font-weight: 700;
    }
    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      font: inherit;
      background: white;
    }
    button {
      position: relative;
      overflow: hidden;
      border: none;
      border-radius: 999px;
      padding: 13px 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(120deg, #cc6a2d, #e0883f, #8e4317, #cc6a2d);
      background-size: 300% 100%;
      color: white;
      margin-top: 8px;
      animation: btn-flow 6s ease infinite;
      transition: transform 200ms ease, box-shadow 200ms ease, filter 200ms ease;
      will-change: transform;
    }
    button::after {
      content: "";
      position: absolute;
      top: 0;
      left: -130%;
      width: 60%;
      height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.5), transparent);
      transform: skewX(-20deg);
      transition: left 600ms ease;
      pointer-events: none;
    }
    button:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 16px 32px rgba(204, 106, 45, 0.4);
      animation-duration: 2.2s;
    }
    button:hover::after {
      left: 140%;
    }
    button:active {
      transform: translateY(0) scale(0.97);
      box-shadow: 0 5px 12px rgba(31, 31, 31, 0.14);
    }
    button:focus-visible {
      outline: 3px solid rgba(204, 106, 45, 0.45);
      outline-offset: 3px;
    }
    @keyframes btn-flow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .ripple {
      position: absolute;
      border-radius: 50%;
      transform: scale(0);
      background: rgba(255, 255, 255, 0.5);
      animation: ripple-anim 600ms linear;
      pointer-events: none;
    }
    @keyframes ripple-anim {
      to { transform: scale(4); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      button,
      button::after {
        transition: background-color 200ms ease;
      }
      button {
        animation: none;
      }
      button:hover {
        transform: none;
      }
      button:hover::after {
        left: -130%;
      }
      .ripple {
        display: none;
      }
    }
    .message {
      min-height: 22px;
      color: var(--muted);
      margin-top: 12px;
    }
    .message.error {
      color: var(--danger);
    }
    .links {
      margin-top: 18px;
    }
    .links a {
      color: var(--accent-dark);
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Admin Access</div>
    <h1>后台登录</h1>
    <p>请输入管理员用户名和密码。登录后你可以新增、编辑和删除项目内容，也可以为项目添加演示视频链接。</p>

    <form id="login-form">
      <label>
        用户名
        <input id="username" name="username" autocomplete="username" required>
      </label>

      <label>
        密码
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </label>

      <button type="submit">登录后台</button>
    </form>

    <div id="message" class="message">请输入登录信息。</div>
    <div class="links">
      <a href="/projects">返回项目列表</a>
    </div>
  </main>

  <script>
    const API_BASE = "https://myblogbackend-njns.onrender.com";
    const AUTH_TOKEN_KEY = "adminToken";
    const form = document.getElementById("login-form");
    const message = document.getElementById("message");

    function setMessage(text, isError = false) {
      message.textContent = text;
      message.className = isError ? "message error" : "message";
    }

    async function verifyExistingSession() {
      const token = localStorage.getItem(AUTH_TOKEN_KEY);
      if (!token) return;

      try {
        const response = await fetch(`${API_BASE}/api/auth/verify`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (response.ok) {
          window.location.href = "/admin";
        }
      } catch {}
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      setMessage("正在登录...");

      try {
        const response = await fetch(`${API_BASE}/api/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: form.username.value.trim(),
            password: form.password.value
          })
        });

        const raw = await response.text();
        let result = {};
        try {
          result = raw ? JSON.parse(raw) : {};
        } catch {
          throw new Error(`服务器返回异常（HTTP ${response.status}），后端可能未正常运行，请稍后重试。`);
        }
        if (!response.ok) {
          throw new Error(result.message || `登录失败（HTTP ${response.status}）。`);
        }

        localStorage.setItem(AUTH_TOKEN_KEY, result.token);
        window.location.href = "/admin";
      } catch (error) {
        setMessage(error.message, true);
      }
    });

    verifyExistingSession();

    (function () {
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      document.addEventListener("click", function (event) {
        const target = event.target.closest("button");
        if (!target) return;
        const rect = target.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        const ripple = document.createElement("span");
        ripple.className = "ripple";
        ripple.style.width = ripple.style.height = `${size}px`;
        ripple.style.left = `${event.clientX - rect.left - size / 2}px`;
        ripple.style.top = `${event.clientY - rect.top - size / 2}px`;
        target.appendChild(ripple);
        ripple.addEventListener("animationend", function () { ripple.remove(); });
      });
    })();
  </script>
</body>
</html>
