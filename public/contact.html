<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>联系我 | Heisd.Stark</title>
  <style>
    :root {
      --bg: #f4efe7;
      --paper: rgba(255, 253, 247, 0.9);
      --card: #fffdf8;
      --ink: #1f1f1f;
      --muted: #6b625b;
      --accent: #cc6a2d;
      --accent-dark: #8e4317;
      --line: #e5dbcf;
      --shadow: 0 22px 50px rgba(68, 48, 30, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(204,106,45,0.14), transparent 22%),
        radial-gradient(circle at bottom right, rgba(142,67,23,0.08), transparent 24%),
        linear-gradient(180deg, #f8f4ed 0%, var(--bg) 100%);
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(12px);
      background: rgba(248, 244, 237, 0.78);
      border-bottom: 1px solid rgba(229, 219, 207, 0.9);
    }

    .topbar-inner {
      max-width: 1160px;
      margin: 0 auto;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
    }

    .brand {
      font-weight: 700;
      color: var(--accent-dark);
      text-decoration: none;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.95rem;
    }

    .nav {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.96rem;
      font-weight: 700;
    }

    .nav a:hover {
      color: var(--accent-dark);
    }

    .section {
      max-width: 1160px;
      margin: 0 auto;
      padding: 64px 24px;
    }

    .section-head {
      display: grid;
      gap: 12px;
      margin-bottom: 32px;
    }

    .section-kicker {
      color: var(--accent-dark);
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 12px;
      font-weight: 700;
    }

    .section h1 {
      margin: 0;
      font-size: clamp(2.2rem, 4vw, 3.4rem);
      line-height: 1.05;
    }

    .section-desc {
      margin: 0;
      color: var(--muted);
      line-height: 1.85;
      max-width: 64ch;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 0.85fr;
      gap: 24px;
      align-items: start;
    }

    .panel {
      background: var(--paper);
      border: 1px solid rgba(229, 219, 207, 0.96);
      border-radius: 26px;
      box-shadow: var(--shadow);
      padding: 30px;
    }

    .panel h2 {
      margin: 0 0 8px;
      font-size: 1.3rem;
    }

    .panel p,
    .panel li {
      color: var(--muted);
      line-height: 1.85;
    }

    .field {
      display: grid;
      gap: 8px;
      margin-bottom: 20px;
    }

    .field label {
      font-weight: 700;
      font-size: 0.98rem;
    }

    .field .hint {
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: 400;
    }

    .field input,
    .field textarea {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fffefb;
      color: var(--ink);
      font-family: inherit;
      font-size: 1rem;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .field input:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(204,106,45,0.14);
    }

    .field textarea {
      min-height: 160px;
      resize: vertical;
      line-height: 1.7;
    }

    .button {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 26px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
      font-size: 1rem;
      background: linear-gradient(120deg, #cc6a2d, #e0883f, #8e4317, #cc6a2d);
      background-size: 300% 100%;
      color: #fff;
      animation: btn-flow 6s ease infinite;
      transition: transform 200ms ease, box-shadow 200ms ease, opacity 160ms ease, filter 200ms ease;
      will-change: transform;
    }

    .button::after {
      content: "";
      position: absolute;
      top: 0;
      left: -130%;
      width: 60%;
      height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.5), transparent);
      transform: skewX(-20deg);
      transition: left 600ms ease;
      pointer-events: none;
    }

    .button:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 16px 32px rgba(31, 31, 31, 0.18);
      filter: brightness(1.05);
    }

    .button:hover::after {
      left: 140%;
    }

    .button:active {
      transform: translateY(0) scale(0.97);
      box-shadow: 0 6px 14px rgba(31, 31, 31, 0.14);
    }

    .button:focus-visible {
      outline: 3px solid rgba(204, 106, 45, 0.45);
      outline-offset: 3px;
    }

    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
      filter: none;
    }

    .button:disabled::after {
      display: none;
    }

    @keyframes btn-flow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      transform: scale(0);
      background: rgba(255, 255, 255, 0.5);
      animation: ripple-anim 600ms linear;
      pointer-events: none;
    }

    @keyframes ripple-anim {
      to { transform: scale(4); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .button,
      .button::after {
        transition: none;
      }
      .button {
        animation: none;
      }
      .button:hover {
        transform: none;
      }
      .button:hover::after {
        left: -130%;
      }
      .ripple {
        display: none;
      }
    }

    .status {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 14px;
      line-height: 1.7;
      display: none;
    }

    .status.show { display: block; }

    .status.success {
      background: rgba(72, 145, 73, 0.12);
      border: 1px solid rgba(72, 145, 73, 0.4);
      color: #2f6b30;
    }

    .status.error {
      background: rgba(204, 106, 45, 0.12);
      border: 1px solid rgba(204, 106, 45, 0.4);
      color: var(--accent-dark);
    }

    .status.info {
      background: rgba(204, 106, 45, 0.08);
      border: 1px solid rgba(204, 106, 45, 0.28);
      color: var(--accent-dark);
    }

    .status a {
      color: var(--accent-dark);
      font-weight: 700;
    }

    .info-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 18px;
    }

    .info-list .label {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent-dark);
      font-weight: 700;
      margin-bottom: 4px;
    }

    .info-list .value {
      color: var(--muted);
      word-break: break-all;
    }

    .info-list a.value {
      color: var(--accent-dark);
      text-decoration: none;
    }

    .info-list a.value:hover { text-decoration: underline; }

    @media (max-width: 880px) {
      .layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">Heisd.Stark</a>
      <nav class="nav">
        <a href="/">首页</a>
        <a href="/projects">项目归档</a>
        <a href="/contact">联系我</a>
        <a href="/admin-login">进入后台</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="section-head">
      <div class="section-kicker">Get in Touch</div>
      <h1>给我留言</h1>
      <p class="section-desc">如果你想交流机器人、AI 辅助开发，或者一起讨论一个项目方向，欢迎在下面给我留言。提交后，你的消息会直接发送到我的邮箱，我会尽快回复你。</p>
    </div>

    <div class="layout">
      <section class="panel">
        <h2>发送消息</h2>
        <p>带 <strong>*</strong> 的为必填项。如果填写了邮箱，我可以更方便地回复你。</p>
        <form id="contact-form" novalidate>
          <div class="field">
            <label for="name">你的称呼 <span style="color:var(--accent-dark)">*</span></label>
            <input id="name" name="name" type="text" maxlength="120" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="email">你的邮箱 <span class="hint">（选填，方便我回复你）</span></label>
            <input id="email" name="email" type="email" maxlength="200" autocomplete="email">
          </div>
          <div class="field">
            <label for="message">留言内容 <span style="color:var(--accent-dark)">*</span></label>
            <textarea id="message" name="message" maxlength="5000" required></textarea>
          </div>
          <button class="button" id="submit-btn" type="submit">发送留言</button>
          <div id="status" class="status"></div>
        </form>
      </section>

      <aside class="panel">
        <h2>其他联系方式</h2>
        <p>你也可以通过下面的方式直接找到我。</p>
        <ul class="info-list">
          <li>
            <div class="label">邮箱</div>
            <a class="value" href="mailto:2284610019@qq.com">2284610019@qq.com</a>
          </li>
          <li>
            <div class="label">电话</div>
            <div class="value">15138357029</div>
          </li>
          <li>
            <div class="label">关于</div>
            <div class="value">机器人控制、计算机视觉与 AI 辅助开发方向的学生与创作者。</div>
          </li>
        </ul>
      </aside>
    </div>
  </main>

  <script>
    const API_BASE = "https://myblogbackend-njns.onrender.com";
    const CONTACT_EMAIL = "2284610019@qq.com";

    const form = document.getElementById("contact-form");
    const statusEl = document.getElementById("status");
    const submitBtn = document.getElementById("submit-btn");

    function escapeHtml(text) {
      return String(text ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function isValidEmail(value) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(value || "").trim());
    }

    function showStatus(type, html) {
      statusEl.className = `status show ${type}`;
      statusEl.innerHTML = html;
    }

    function delay(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    // Render 免费实例闲置后会休眠，下次访问需 30~60s 冷启动，期间请求会失败
    // 或被网关返回 5xx（响应体不是我们的 JSON）。这里带退避重试，并区分
    // 「冷启动」与「应用本身的有效响应」（如留言接口主动返回的 503/502 JSON）。
    const RETRY_DELAYS = [1500, 2500, 4000, 6000, 8000, 10000];
    const COLD_START_STATUSES = new Set([502, 503, 504]);

    async function fetchWithWake(url, options = {}, { retries = 6, onWaking } = {}) {
      let lastError;
      for (let attempt = 0; ; attempt++) {
        try {
          const response = await fetch(url, options);
          const raw = await response.text();
          let data = null;
          try {
            data = raw ? JSON.parse(raw) : null;
          } catch {
            data = null;
          }
          // 5xx 且响应体不是 JSON → 多半是 Render 网关的冷启动错误页，重试。
          const looksColdStart = COLD_START_STATUSES.has(response.status) && data === null;
          if (looksColdStart && attempt < retries) {
            if (onWaking) onWaking(attempt + 1);
            await delay(RETRY_DELAYS[Math.min(attempt, RETRY_DELAYS.length - 1)]);
            continue;
          }
          return { ok: response.ok, status: response.status, data };
        } catch (error) {
          // 网络错误/超时：几乎都是冷启动或网络波动，重试。
          lastError = error;
          if (attempt < retries) {
            if (onWaking) onWaking(attempt + 1);
            await delay(RETRY_DELAYS[Math.min(attempt, RETRY_DELAYS.length - 1)]);
            continue;
          }
          throw lastError;
        }
      }
    }

    function buildMailtoFallback(name, email, message) {
      const subject = encodeURIComponent(`博客留言 - 来自 ${name || "访客"}`);
      const bodyLines = [];
      if (email) bodyLines.push(`我的邮箱：${email}`);
      bodyLines.push("", message || "");
      const body = encodeURIComponent(bodyLines.join("\n"));
      return `mailto:${CONTACT_EMAIL}?subject=${subject}&body=${body}`;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const message = document.getElementById("message").value.trim();

      if (!name || !message) {
        showStatus("error", "请填写你的称呼和留言内容。");
        return;
      }

      if (email && !isValidEmail(email)) {
        showStatus("error", "邮箱格式不正确，请检查后重试。");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "发送中...";
      statusEl.className = "status";
      statusEl.innerHTML = "";

      try {
        const result = await fetchWithWake(
          `${API_BASE}/api/contact`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, email, message }),
          },
          {
            onWaking: (n) =>
              showStatus("info", `服务器正在唤醒，请稍候…（第 ${n} 次重试）`),
          }
        );

        const data = result.data || {};
        if (result.ok) {
          showStatus("success", escapeHtml(data.message || "留言已发送，感谢你的联系！"));
          form.reset();
        } else {
          const fallback = buildMailtoFallback(name, email, message);
          const base = escapeHtml(data.message || "留言发送失败，请稍后重试。");
          showStatus(
            "error",
            `${base} 你也可以 <a href="${fallback}">点此用邮件直接发送给我</a>。`
          );
        }
      } catch (error) {
        const fallback = buildMailtoFallback(name, email, message);
        showStatus(
          "error",
          `网络异常，留言暂时无法发送。你可以 <a href="${fallback}">点此用邮件直接发送给我</a>。`
        );
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "发送留言";
      }
    });

    (function () {
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      document.addEventListener("click", function (event) {
        const target = event.target.closest(".button, button");
        if (!target) return;
        const rect = target.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        const ripple = document.createElement("span");
        ripple.className = "ripple";
        ripple.style.width = ripple.style.height = `${size}px`;
        ripple.style.left = `${event.clientX - rect.left - size / 2}px`;
        ripple.style.top = `${event.clientY - rect.top - size / 2}px`;
        target.appendChild(ripple);
        ripple.addEventListener("animationend", function () { ripple.remove(); });
      });
    })();
  </script>
</body>
</html>
