<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目归档</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --ink: #1f2328;
      --muted: #5d6670;
      --line: #e2e8f0;
      --accent: #fc5531;
      --accent-dark: #d94323;
      --tag-bg: #fff1ec;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(180deg, #f8fafc 0%, var(--bg) 100%);
      color: var(--ink);
    }
    header {
      background: white;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .bar {
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .brand {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent);
      text-decoration: none;
    }
    .nav {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }
    .nav a {
      color: var(--muted);
      text-decoration: none;
      font-weight: 600;
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px 60px;
    }
    .hero {
      background: radial-gradient(circle at top right, rgba(252,85,49,0.12), transparent 32%), white;
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 32px;
      margin-bottom: 28px;
    }
    .hero h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 3vw, 3rem);
    }
    .hero p {
      margin: 0;
      max-width: 60ch;
      color: var(--muted);
      line-height: 1.7;
    }
    .list {
      display: grid;
      gap: 22px;
    }
    .card {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 22px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 16px 34px rgba(15, 23, 42, 0.06);
      transition: transform 220ms ease, box-shadow 220ms ease;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 26px 50px rgba(15, 23, 42, 0.13);
    }
    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      min-height: 220px;
    }
    .content {
      padding: 24px 24px 24px 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .meta {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .title {
      margin: 0 0 10px;
      font-size: 1.6rem;
      line-height: 1.25;
    }
    .summary {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.8;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--tag-bg);
      color: var(--accent-dark);
      font-size: 0.88rem;
      font-weight: 700;
    }
    .link {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
      align-self: flex-start;
      transition: color 150ms ease, transform 150ms ease;
    }
    .link:hover {
      color: var(--accent-dark);
      transform: translateX(4px);
    }
    @media (prefers-reduced-motion: reduce) {
      .card,
      .link {
        transition: none;
      }
      .card:hover,
      .link:hover {
        transform: none;
      }
    }
    .empty, .error {
      background: white;
      border: 1px dashed var(--line);
      border-radius: 18px;
      padding: 28px;
      color: var(--muted);
    }
    @media (max-width: 760px) {
      .card {
        grid-template-columns: 1fr;
      }
      .content {
        padding: 0 20px 22px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <a class="brand" href="/">机器人博客</a>
      <nav class="nav">
        <a href="/projects">项目归档</a>
        <a href="/admin-login">后台登录</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>项目归档</h1>
      <p>这里整理了我的机器人、视觉与 AI 项目文章。每个项目都包含摘要、封面和完整正文；如果配置了演示视频，也会在详情页中直接展示。</p>
    </section>

    <section id="projects-list" class="list"></section>
  </main>

  <script>
    const API_BASE = "https://myblogbackend-njns.onrender.com";

    function escapeHtml(text) {
      return String(text ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function delay(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    // Render 免费实例闲置后会休眠，下次访问需 30~60s 冷启动，期间请求会失败
    // 或被网关返回 5xx（响应体不是我们的 JSON）。这里带退避重试，自动撑过冷启动。
    const RETRY_DELAYS = [1500, 2500, 4000, 6000, 8000, 10000];
    const COLD_START_STATUSES = new Set([502, 503, 504]);

    async function fetchWithWake(url, options = {}, { retries = 6, onWaking } = {}) {
      let lastError;
      for (let attempt = 0; ; attempt++) {
        try {
          const response = await fetch(url, options);
          const raw = await response.text();
          let data = null;
          try {
            data = raw ? JSON.parse(raw) : null;
          } catch {
            data = null;
          }
          const looksColdStart = COLD_START_STATUSES.has(response.status) && data === null;
          if (looksColdStart && attempt < retries) {
            if (onWaking) onWaking(attempt + 1);
            await delay(RETRY_DELAYS[Math.min(attempt, RETRY_DELAYS.length - 1)]);
            continue;
          }
          return { ok: response.ok, status: response.status, data };
        } catch (error) {
          lastError = error;
          if (attempt < retries) {
            if (onWaking) onWaking(attempt + 1);
            await delay(RETRY_DELAYS[Math.min(attempt, RETRY_DELAYS.length - 1)]);
            continue;
          }
          throw lastError;
        }
      }
    }

    async function loadProjects() {
      const container = document.getElementById("projects-list");
      container.innerHTML = "<div class='empty'>正在加载项目...</div>";

      try {
        const result = await fetchWithWake(
          `${API_BASE}/api/projects`,
          {},
          {
            onWaking: (n) => {
              container.innerHTML =
                `<div class='empty'>服务器正在唤醒，请稍候…（第 ${n} 次重试）<br>免费服务器闲置后会休眠，首次访问需要 30~60 秒。</div>`;
            },
          }
        );

        if (!result.ok) {
          throw new Error("加载项目失败。");
        }
        const projects = result.data;
        if (!Array.isArray(projects)) {
          throw new Error("服务器返回异常，请稍后重试。");
        }

        if (!projects.length) {
          container.innerHTML = "<div class='empty'>暂时还没有已发布的项目。</div>";
          return;
        }

        container.innerHTML = projects.map((project) => `
          <article class="card">
            <img src="${escapeHtml(project.coverImage)}" alt="${escapeHtml(project.title)}">
            <div class="content">
              <div class="meta">${escapeHtml(project.date || "未设置日期")}</div>
              <h2 class="title">${escapeHtml(project.title)}</h2>
              <p class="summary">${escapeHtml(project.summary)}</p>
              <div class="tags">
                ${project.videoUrl ? '<span class="tag">含演示视频</span>' : '<span class="tag">图文项目</span>'}
              </div>
              <a class="link" href="/project/${encodeURIComponent(project.id)}">查看全文</a>
            </div>
          </article>
        `).join("");
      } catch (error) {
        container.innerHTML = `<div class="error">${error.message}</div>`;
      }
    }

    loadProjects();
  </script>
</body>
</html>
