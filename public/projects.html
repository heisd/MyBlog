<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目归档 | Heisd.Stark</title>
  <style>
    :root {
      --bg: #f4efe7;
      --paper: rgba(255, 253, 247, 0.92);
      --card: #fffdf8;
      --ink: #1f1f1f;
      --muted: #6b625b;
      --accent: #cc6a2d;
      --accent-dark: #8e4317;
      --line: #e5dbcf;
      --shadow: 0 22px 50px rgba(68, 48, 30, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(204,106,45,0.14), transparent 22%),
        radial-gradient(circle at bottom right, rgba(142,67,23,0.08), transparent 24%),
        linear-gradient(180deg, #f8f4ed 0%, var(--bg) 100%);
      min-height: 100vh;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(12px);
      background: rgba(248, 244, 237, 0.78);
      border-bottom: 1px solid rgba(229, 219, 207, 0.9);
    }
    .topbar-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
    }
    .brand {
      font-weight: 700;
      color: var(--accent-dark);
      text-decoration: none;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.95rem;
    }
    .nav {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.96rem;
      font-weight: 700;
    }
    .nav a:hover { color: var(--accent-dark); }
    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 40px 24px 70px;
    }
    .hero {
      position: relative;
      overflow: hidden;
      background: var(--paper);
      border: 1px solid rgba(229, 219, 207, 0.96);
      border-radius: 26px;
      padding: 40px;
      margin-bottom: 32px;
      box-shadow: var(--shadow);
    }
    .eyebrow {
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent-dark);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 14px;
    }
    .hero h1 {
      margin: 0 0 14px;
      font-size: clamp(2.2rem, 4vw, 3.4rem);
      line-height: 1.05;
    }
    .hero p {
      margin: 0;
      max-width: 64ch;
      color: var(--muted);
      line-height: 1.85;
      font-size: 1.04rem;
    }
    .list { display: grid; gap: 24px; }
    .card {
      display: grid;
      grid-template-columns: 320px 1fr;
      background: var(--card);
      border: 1px solid rgba(229, 219, 207, 0.96);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform 220ms ease, box-shadow 220ms ease;
      animation: card-in 600ms ease backwards;
      animation-delay: calc(var(--i, 0) * 70ms);
    }
    @keyframes card-in {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: none; }
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 30px 60px rgba(68, 48, 30, 0.16);
    }
    .cover {
      position: relative;
      min-height: 220px;
      background: linear-gradient(135deg, #f0ddc8, #e7cdb2 60%, #d9b896);
    }
    .cover-ph {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(142, 67, 23, 0.45);
      font-size: 2.6rem;
      font-weight: 800;
      letter-spacing: 0.06em;
    }
    .cover img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .cover img.broken { display: none; }
    .content {
      padding: 28px 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .meta {
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      margin-bottom: 10px;
    }
    .title {
      margin: 0 0 12px;
      font-size: 1.55rem;
      line-height: 1.25;
    }
    .summary {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.85;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(204,106,45,0.12);
      color: var(--accent-dark);
      font-size: 0.84rem;
      font-weight: 700;
    }
    .link {
      color: var(--accent-dark);
      font-weight: 700;
      text-decoration: none;
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 150ms ease, gap 150ms ease;
    }
    .link:hover { color: var(--accent); gap: 12px; }
    .empty, .error {
      background: var(--paper);
      border: 1px dashed var(--line);
      border-radius: 20px;
      padding: 30px;
      color: var(--muted);
      line-height: 1.8;
      text-align: center;
    }
    @media (max-width: 760px) {
      .card { grid-template-columns: 1fr; }
      .cover { min-height: 200px; height: 200px; }
      .content { padding: 22px 22px 24px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .card, .link { transition: none; animation: none; }
      .card:hover, .link:hover { transform: none; gap: 6px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">Heisd.Stark</a>
      <nav class="nav">
        <a href="/">首页</a>
        <a href="/projects">项目归档</a>
        <a href="/contact">联系我</a>
        <a href="/admin-login">进入后台</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <div class="eyebrow">Project Archive</div>
      <h1>项目归档</h1>
      <p>这里整理了我的机器人、视觉与 AI 项目文章。每个项目都包含摘要、封面和完整正文；如果配置了演示视频，也会在详情页中直接展示。</p>
    </section>

    <section id="projects-list" class="list"></section>
  </main>

  <script>
    const API_BASE = "https://myblogbackend-njns.onrender.com";

    function escapeHtml(text) {
      return String(text ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function delay(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    // Render 免费实例闲置后会休眠，下次访问需 30~60s 冷启动，期间请求会失败
    // 或被网关返回 5xx（响应体不是我们的 JSON）。这里带退避重试，自动撑过冷启动。
    const RETRY_DELAYS = [1500, 2500, 4000, 6000, 8000, 10000];
    const COLD_START_STATUSES = new Set([502, 503, 504]);

    async function fetchWithWake(url, options = {}, { retries = 6, onWaking } = {}) {
      let lastError;
      for (let attempt = 0; ; attempt++) {
        try {
          const response = await fetch(url, options);
          const raw = await response.text();
          let data = null;
          try {
            data = raw ? JSON.parse(raw) : null;
          } catch {
            data = null;
          }
          const looksColdStart = COLD_START_STATUSES.has(response.status) && data === null;
          if (looksColdStart && attempt < retries) {
            if (onWaking) onWaking(attempt + 1);
            await delay(RETRY_DELAYS[Math.min(attempt, RETRY_DELAYS.length - 1)]);
            continue;
          }
          return { ok: response.ok, status: response.status, data };
        } catch (error) {
          lastError = error;
          if (attempt < retries) {
            if (onWaking) onWaking(attempt + 1);
            await delay(RETRY_DELAYS[Math.min(attempt, RETRY_DELAYS.length - 1)]);
            continue;
          }
          throw lastError;
        }
      }
    }

    function firstChar(text) {
      const trimmed = String(text || "").trim();
      return trimmed ? escapeHtml(trimmed.charAt(0)) : "◎";
    }

    async function loadProjects() {
      const container = document.getElementById("projects-list");
      container.innerHTML = "<div class='empty'>正在加载项目...</div>";

      try {
        const result = await fetchWithWake(
          `${API_BASE}/api/projects`,
          {},
          {
            onWaking: (n) => {
              container.innerHTML =
                `<div class='empty'>服务器正在唤醒，请稍候…（第 ${n} 次重试）<br>免费服务器闲置后会休眠，首次访问需要 30~60 秒。</div>`;
            },
          }
        );

        if (!result.ok) {
          throw new Error("加载项目失败。");
        }
        const projects = result.data;
        if (!Array.isArray(projects)) {
          throw new Error("服务器返回异常，请稍后重试。");
        }

        if (!projects.length) {
          container.innerHTML = "<div class='empty'>暂时还没有已发布的项目。</div>";
          return;
        }

        container.innerHTML = projects.map((project, index) => `
          <article class="card" style="--i:${index}">
            <div class="cover">
              <span class="cover-ph">${firstChar(project.title)}</span>
              <img src="${escapeHtml(project.coverImage)}" alt="${escapeHtml(project.title)}"
                   loading="lazy" referrerpolicy="no-referrer"
                   onerror="this.classList.add('broken')">
            </div>
            <div class="content">
              <div class="meta">${escapeHtml(project.date || "未设置日期")}</div>
              <h2 class="title">${escapeHtml(project.title)}</h2>
              <p class="summary">${escapeHtml(project.summary)}</p>
              <div class="tags">
                ${project.videoUrl ? '<span class="tag">含演示视频</span>' : '<span class="tag">图文项目</span>'}
              </div>
              <a class="link" href="/project/${encodeURIComponent(project.id)}">查看全文 →</a>
            </div>
          </article>
        `).join("");

        attachCardTilt();
      } catch (error) {
        container.innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
      }
    }

    // 鼠标在卡片上移动时做 3D 倾斜，离开时复位（尊重 prefers-reduced-motion）。
    function attachCardTilt() {
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        return;
      }
      document.querySelectorAll(".card").forEach((card) => {
        card.addEventListener("mousemove", (event) => {
          const rect = card.getBoundingClientRect();
          const px = (event.clientX - rect.left) / rect.width - 0.5;
          const py = (event.clientY - rect.top) / rect.height - 0.5;
          card.style.transition = "transform 80ms ease";
          card.style.transform =
            `perspective(1000px) rotateX(${(-py * 4).toFixed(2)}deg) rotateY(${(px * 6).toFixed(2)}deg) translateY(-5px)`;
        });
        card.addEventListener("mouseleave", () => {
          card.style.transition = "transform 320ms ease, box-shadow 320ms ease";
          card.style.transform = "";
        });
      });
    }

    loadProjects();
  </script>
</body>
</html>
