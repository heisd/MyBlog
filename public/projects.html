<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目归档 | Heisd.Stark</title>
  <style>
    :root {
      --bg: #f4efe7;
      --paper: rgba(255, 253, 247, 0.92);
      --card: #fffdf8;
      --ink: #1f1f1f;
      --muted: #6b625b;
      --accent: #cc6a2d;
      --accent-dark: #8e4317;
      --line: #e5dbcf;
      --shadow: 0 22px 50px rgba(68, 48, 30, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(204,106,45,0.14), transparent 22%),
        radial-gradient(circle at bottom right, rgba(142,67,23,0.08), transparent 24%),
        linear-gradient(180deg, #f8f4ed 0%, var(--bg) 100%);
      min-height: 100vh;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(12px);
      background: rgba(248, 244, 237, 0.78);
      border-bottom: 1px solid rgba(229, 219, 207, 0.9);
    }
    .topbar-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
    }
    .brand {
      font-weight: 700;
      color: var(--accent-dark);
      text-decoration: none;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.95rem;
    }
    .nav { display: flex; gap: 16px; flex-wrap: wrap; }
    .nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.96rem;
      font-weight: 700;
    }
    .nav a:hover { color: var(--accent-dark); }
    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 40px 24px 70px;
    }
    .hero {
      background: var(--paper);
      border: 1px solid rgba(229, 219, 207, 0.96);
      border-radius: 26px;
      padding: 40px;
      margin-bottom: 26px;
      box-shadow: var(--shadow);
    }
    .eyebrow {
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent-dark);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 14px;
    }
    .hero h1 {
      margin: 0 0 14px;
      font-size: clamp(2.2rem, 4vw, 3.4rem);
      line-height: 1.05;
    }
    .hero p {
      margin: 0;
      max-width: 64ch;
      color: var(--muted);
      line-height: 1.85;
      font-size: 1.04rem;
    }

    .toolbar {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 26px;
    }
    .search {
      position: relative;
      flex: 1 1 260px;
      max-width: 380px;
    }
    .search .icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      display: flex;
    }
    .search input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fffefb;
      font: inherit;
      color: var(--ink);
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }
    .search input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(204,106,45,0.14);
    }
    .filters { display: flex; gap: 10px; flex-wrap: wrap; }
    .chip {
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--muted);
      border-radius: 999px;
      padding: 8px 16px;
      font: inherit;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      transition: transform 150ms ease, border-color 150ms ease, color 150ms ease, background-color 150ms ease;
    }
    .chip:hover { border-color: var(--accent); color: var(--accent-dark); transform: translateY(-1px); }
    .chip.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .chip-n {
      margin-left: 6px;
      font-size: 0.78rem;
      opacity: 0.7;
    }

    .list {
      columns: 330px;
      column-gap: 24px;
    }
    .card {
      break-inside: avoid;
      margin: 0 0 24px;
      display: block;
      width: 100%;
      background: var(--card);
      border: 1px solid rgba(229, 219, 207, 0.96);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform 220ms ease, box-shadow 220ms ease;
      animation: card-in 600ms ease backwards;
      animation-delay: calc(var(--i, 0) * 60ms);
    }
    .list.no-anim .card { animation: none; }
    @keyframes card-in {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: none; }
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 30px 60px rgba(68, 48, 30, 0.16);
    }
    .cover {
      position: relative;
      aspect-ratio: 16 / 10;
      background: linear-gradient(135deg, #f0ddc8, #e7cdb2 60%, #d9b896);
    }
    .cover-ph {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(142, 67, 23, 0.45);
      font-size: 2.6rem;
      font-weight: 800;
    }
    .cover img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .cover img.broken { display: none; }
    .pin-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1;
      background: var(--accent);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 999px;
      box-shadow: 0 6px 16px rgba(204, 106, 45, 0.4);
    }
    .content { padding: 22px 24px 24px; }
    .meta {
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }
    .title {
      margin: 0 0 10px;
      font-size: 1.4rem;
      line-height: 1.3;
    }
    .summary {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.8;
      display: -webkit-box;
      -webkit-line-clamp: 5;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(204,106,45,0.14);
      color: var(--accent-dark);
      font-size: 0.82rem;
      font-weight: 700;
    }
    .tag-soft {
      background: rgba(107, 98, 91, 0.12);
      color: var(--muted);
    }
    .link {
      color: var(--accent-dark);
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 150ms ease, gap 150ms ease;
    }
    .link:hover { color: var(--accent); gap: 12px; }
    .card-actions {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .repo-mini {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.86rem;
      font-weight: 700;
      transition: color 150ms ease;
    }
    .repo-mini svg { width: 15px; height: 15px; }
    .repo-mini:hover { color: var(--ink); }
    .repo-mini.locked { color: var(--accent-dark); }
    .repo-mini.locked:hover { color: var(--accent); text-decoration: underline; }
    .empty, .error {
      background: var(--paper);
      border: 1px dashed var(--line);
      border-radius: 20px;
      padding: 30px;
      color: var(--muted);
      line-height: 1.8;
      text-align: center;
    }
    @media (prefers-reduced-motion: reduce) {
      .card, .link, .chip { transition: none; animation: none; }
      .card:hover, .link:hover, .chip:hover { transform: none; gap: 6px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">Heisd.Stark</a>
      <nav class="nav">
        <a href="/">首页</a>
        <a href="/projects">项目归档</a>
        <a href="/forum">论坛</a>
        <a href="/contact">联系我</a>
        <a href="/admin-login">进入后台</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <div class="eyebrow">Project Archive</div>
      <h1>项目归档</h1>
      <p>这里整理了我的机器人、视觉与 AI 项目文章。可以用下方的搜索框按关键词查找，或点击分类标签筛选。</p>
    </section>

    <div class="toolbar" id="toolbar" style="display:none;">
      <div class="search">
        <span class="icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </span>
        <input id="search" type="search" placeholder="搜索项目标题或摘要…" autocomplete="off">
      </div>
      <div class="filters" id="filters"></div>
      <button type="button" class="chip" id="sort-toggle" title="切换时间排序">最新优先</button>
    </div>

    <section id="projects-list" class="list"></section>
  </main>

  <script>
    const API_BASE = "https://myblogbackend-njns.onrender.com";

    function accessHeaders() {
      const headers = {};
      const visitor = localStorage.getItem("visitorAccessToken");
      if (visitor) headers["X-Access-Token"] = visitor;
      const admin = localStorage.getItem("adminToken");
      if (admin) headers["Authorization"] = `Bearer ${admin}`;
      return headers;
    }

    const listEl = document.getElementById("projects-list");
    const toolbar = document.getElementById("toolbar");
    const filtersEl = document.getElementById("filters");
    const searchInput = document.getElementById("search");

    let allProjects = [];
    let activeCategory = "全部";
    let searchTerm = "";
    let sortOrder = "newest";

    // 置顶项目始终排在前，其余按日期（新→旧 或 旧→新）排序。
    function sortProjects(list) {
      return list.slice().sort((a, b) => {
        const pa = a.pinned ? 1 : 0;
        const pb = b.pinned ? 1 : 0;
        if (pa !== pb) return pb - pa;
        const da = a.date || "";
        const db = b.date || "";
        return sortOrder === "newest" ? db.localeCompare(da) : da.localeCompare(db);
      });
    }

    // 关键词分类规则：按从“具体”到“宽泛”的优先级匹配，命中第一个即归类。
    // （机器人/嵌入式较宽泛，放在视觉/语音/AI 之后，避免抢分类。）
    const CATEGORY_RULES = [
      { name: "视觉", keys: ["视觉", "图像", "检测", "vision", "opencv", "yolo", "抓取", "相机", "摄像头"] },
      { name: "语音", keys: ["语音", "voice", "麦克风", "whisper", "对话", "asr", "声音"] },
      { name: "AI", keys: ["深度学习", "机器学习", "神经网络", "llm", "大模型", "模型"] },
      { name: "机器人", keys: ["机器人", "robot", "ros", "micro-ros", "底盘", "机械臂", "运动控制"] },
      { name: "嵌入式", keys: ["esp32", "嵌入式", "pcb", "传感器", "iot", "单片机", "stm32", "arduino", "硬件"] },
    ];

    function escapeHtml(text) {
      return String(text ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function firstChar(text) {
      const trimmed = String(text || "").trim();
      return trimmed ? escapeHtml(trimmed.charAt(0)) : "◎";
    }

    function detectCategory(project) {
      const text = `${project.title || ""} ${project.summary || ""}`.toLowerCase();
      for (const rule of CATEGORY_RULES) {
        if (rule.keys.some((key) => text.includes(key))) return rule.name;
      }
      return "其他";
    }

    // 优先用后台填写的真实标签；没有标签的旧项目回退到关键词自动分类。
    function projectTags(project) {
      const tags = Array.isArray(project.tags) ? project.tags.filter(Boolean) : [];
      return tags.length ? tags : [detectCategory(project)];
    }

    function delay(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    // Render 免费实例闲置后会休眠，下次访问需 30~60s 冷启动，期间请求会失败
    // 或被网关返回 5xx（响应体不是我们的 JSON）。这里带退避重试，自动撑过冷启动。
    const RETRY_DELAYS = [1500, 2500, 4000, 6000, 8000, 10000];
    const COLD_START_STATUSES = new Set([502, 503, 504]);

    async function fetchWithWake(url, options = {}, { retries = 6, onWaking } = {}) {
      let lastError;
      for (let attempt = 0; ; attempt++) {
        try {
          const response = await fetch(url, options);
          const raw = await response.text();
          let data = null;
          try {
            data = raw ? JSON.parse(raw) : null;
          } catch {
            data = null;
          }
          const looksColdStart = COLD_START_STATUSES.has(response.status) && data === null;
          if (looksColdStart && attempt < retries) {
            if (onWaking) onWaking(attempt + 1);
            await delay(RETRY_DELAYS[Math.min(attempt, RETRY_DELAYS.length - 1)]);
            continue;
          }
          return { ok: response.ok, status: response.status, data };
        } catch (error) {
          lastError = error;
          if (attempt < retries) {
            if (onWaking) onWaking(attempt + 1);
            await delay(RETRY_DELAYS[Math.min(attempt, RETRY_DELAYS.length - 1)]);
            continue;
          }
          throw lastError;
        }
      }
    }

    function cardHtml(project, index) {
      const tagsHtml = projectTags(project)
        .slice(0, 4)
        .map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`)
        .join("");
      return `
        <article class="card" style="--i:${index}">
          <div class="cover">
            ${project.pinned ? '<span class="pin-badge">★ 置顶</span>' : ""}
            <span class="cover-ph">${firstChar(project.title)}</span>
            <img src="${escapeHtml(project.coverImage)}" alt="${escapeHtml(project.title)}"
                 loading="lazy" referrerpolicy="no-referrer"
                 onerror="this.classList.add('broken')">
          </div>
          <div class="content">
            <div class="meta">${escapeHtml(project.date || "未设置日期")}</div>
            <h2 class="title">${escapeHtml(project.title)}</h2>
            <p class="summary">${escapeHtml(project.summary)}</p>
            <div class="tags">
              ${tagsHtml}
              ${project.videoUrl ? '<span class="tag tag-soft">含演示视频</span>' : ""}
            </div>
            <div class="card-actions">
              <a class="link" href="/project/${encodeURIComponent(project.id)}">查看全文 →</a>
              ${project.repoUrl ? `<a class="repo-mini" href="/project/${encodeURIComponent(project.id)}" title="站内浏览源码"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg>源码</a>`
                : (project.repoLocked ? '<a class="repo-mini locked" href="/welcome" title="开通会员后可浏览私有仓库源码">🔒 开通会员看源码</a>' : "")}
            </div>
          </div>
        </article>`;
    }

    function buildFilters() {
      const counts = new Map();
      allProjects.forEach((project) => {
        projectTags(project).forEach((tag) => counts.set(tag, (counts.get(tag) || 0) + 1));
      });
      const preferred = ["视觉", "语音", "AI", "机器人", "嵌入式", "其他"];
      const tags = Array.from(counts.keys()).sort((a, b) => {
        const ra = preferred.indexOf(a) === -1 ? 999 : preferred.indexOf(a);
        const rb = preferred.indexOf(b) === -1 ? 999 : preferred.indexOf(b);
        return ra !== rb ? ra - rb : a.localeCompare(b, "zh");
      });
      const names = ["全部"].concat(tags);
      filtersEl.innerHTML = names
        .map((name) => {
          const count = name === "全部" ? allProjects.length : counts.get(name);
          return `<button type="button" class="chip${name === activeCategory ? " active" : ""}" data-cat="${escapeHtml(name)}">${escapeHtml(name)}<span class="chip-n">${count}</span></button>`;
        })
        .join("");
    }

    function render(animate = false) {
      listEl.classList.toggle("no-anim", !animate);
      const filtered = allProjects.filter((project) => {
        const inCategory = activeCategory === "全部" || projectTags(project).includes(activeCategory);
        const haystack = `${project.title || ""} ${project.summary || ""} ${projectTags(project).join(" ")}`.toLowerCase();
        const inSearch = !searchTerm || haystack.includes(searchTerm);
        return inCategory && inSearch;
      });

      if (!filtered.length) {
        listEl.innerHTML = `<div class="empty">没有匹配的项目，换个关键词或分类试试。</div>`;
        return;
      }

      listEl.innerHTML = sortProjects(filtered).map((project, index) => cardHtml(project, index)).join("");
      attachCardTilt();
    }

    // 鼠标在卡片上移动时做 3D 倾斜，离开时复位（尊重 prefers-reduced-motion）。
    function attachCardTilt() {
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        return;
      }
      document.querySelectorAll(".card").forEach((card) => {
        card.addEventListener("mousemove", (event) => {
          const rect = card.getBoundingClientRect();
          const px = (event.clientX - rect.left) / rect.width - 0.5;
          const py = (event.clientY - rect.top) / rect.height - 0.5;
          card.style.transition = "transform 80ms ease";
          card.style.transform =
            `perspective(1000px) rotateX(${(-py * 4).toFixed(2)}deg) rotateY(${(px * 6).toFixed(2)}deg) translateY(-5px)`;
        });
        card.addEventListener("mouseleave", () => {
          card.style.transition = "transform 320ms ease, box-shadow 320ms ease";
          card.style.transform = "";
        });
      });
    }

    filtersEl.addEventListener("click", (event) => {
      const chip = event.target.closest(".chip");
      if (!chip) return;
      activeCategory = chip.dataset.cat;
      buildFilters();
      render(false);
    });

    searchInput.addEventListener("input", () => {
      searchTerm = searchInput.value.trim().toLowerCase();
      render(false);
    });

    document.getElementById("sort-toggle").addEventListener("click", (event) => {
      sortOrder = sortOrder === "newest" ? "oldest" : "newest";
      event.currentTarget.textContent = sortOrder === "newest" ? "最新优先" : "最早优先";
      render(false);
    });

    async function loadProjects() {
      listEl.innerHTML = "<div class='empty'>正在加载项目...</div>";

      try {
        const result = await fetchWithWake(
          `${API_BASE}/api/projects`,
          { headers: accessHeaders() },
          {
            onWaking: (n) => {
              listEl.innerHTML =
                `<div class='empty'>服务器正在唤醒，请稍候…（第 ${n} 次重试）<br>免费服务器闲置后会休眠，首次访问需要 30~60 秒。</div>`;
            },
          }
        );

        if (result.status === 401) {
          window.location.href = "/welcome";
          return;
        }
        if (!result.ok) {
          throw new Error("加载项目失败。");
        }
        const projects = result.data;
        if (!Array.isArray(projects)) {
          throw new Error("服务器返回异常，请稍后重试。");
        }

        if (!projects.length) {
          listEl.innerHTML = "<div class='empty'>暂时还没有已发布的项目。</div>";
          return;
        }

        allProjects = projects;

        // 支持从详情页点击标签跳转过来时预选该分类（/projects?tag=视觉）。
        const wantTag = new URLSearchParams(window.location.search).get("tag");
        if (wantTag) {
          const present = new Set();
          allProjects.forEach((project) => projectTags(project).forEach((tag) => present.add(tag)));
          if (present.has(wantTag)) activeCategory = wantTag;
        }

        buildFilters();
        toolbar.style.display = "flex";
        render(true);
      } catch (error) {
        listEl.innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
      }
    }

    loadProjects();
  </script>
  <script src="/assistant.js" defer></script>
  <script src="/nav-auth.js" defer></script>
</body>
</html>
