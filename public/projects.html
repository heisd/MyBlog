<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目归档</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --ink: #1f2328;
      --muted: #5d6670;
      --line: #e2e8f0;
      --accent: #fc5531;
      --accent-dark: #d94323;
      --tag-bg: #fff1ec;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(180deg, #f8fafc 0%, var(--bg) 100%);
      color: var(--ink);
    }
    header {
      background: white;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .bar {
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .brand {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent);
      text-decoration: none;
    }
    .nav {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }
    .nav a {
      color: var(--muted);
      text-decoration: none;
      font-weight: 600;
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px 60px;
    }
    .hero {
      background: radial-gradient(circle at top right, rgba(252,85,49,0.12), transparent 32%), white;
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 32px;
      margin-bottom: 28px;
    }
    .hero h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 3vw, 3rem);
    }
    .hero p {
      margin: 0;
      max-width: 60ch;
      color: var(--muted);
      line-height: 1.7;
    }
    .list {
      display: grid;
      gap: 22px;
    }
    .card {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 22px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 16px 34px rgba(15, 23, 42, 0.06);
    }
    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      min-height: 220px;
    }
    .content {
      padding: 24px 24px 24px 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .meta {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .title {
      margin: 0 0 10px;
      font-size: 1.6rem;
      line-height: 1.25;
    }
    .summary {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.8;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--tag-bg);
      color: var(--accent-dark);
      font-size: 0.88rem;
      font-weight: 700;
    }
    .link {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
      align-self: flex-start;
    }
    .empty, .error {
      background: white;
      border: 1px dashed var(--line);
      border-radius: 18px;
      padding: 28px;
      color: var(--muted);
    }
    @media (max-width: 760px) {
      .card {
        grid-template-columns: 1fr;
      }
      .content {
        padding: 0 20px 22px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <a class="brand" href="/">机器人博客</a>
      <nav class="nav">
        <a href="/projects">项目归档</a>
        <a href="/admin-login">后台登录</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>项目归档</h1>
      <p>这里整理了我的机器人、视觉与 AI 项目文章。每个项目都包含摘要、封面和完整正文；如果配置了演示视频，也会在详情页中直接展示。</p>
    </section>

    <section id="projects-list" class="list"></section>
  </main>

  <script>
    const API_BASE = "https://myblogbackend-njns.onrender.com";

    async function loadProjects() {
      const container = document.getElementById("projects-list");
      container.innerHTML = "<div class='empty'>正在加载项目...</div>";

      try {
        const response = await fetch(`${API_BASE}/api/projects`);
        if (!response.ok) {
          throw new Error("加载项目失败。");
        }
        let projects;
        try {
          projects = await response.json();
        } catch {
          throw new Error("服务器返回异常，请稍后重试。");
        }

        if (!projects.length) {
          container.innerHTML = "<div class='empty'>暂时还没有已发布的项目。</div>";
          return;
        }

        container.innerHTML = projects.map((project) => `
          <article class="card">
            <img src="${project.coverImage}" alt="${project.title}">
            <div class="content">
              <div class="meta">${project.date || "未设置日期"}</div>
              <h2 class="title">${project.title}</h2>
              <p class="summary">${project.summary}</p>
              <div class="tags">
                ${project.videoUrl ? '<span class="tag">含演示视频</span>' : '<span class="tag">图文项目</span>'}
              </div>
              <a class="link" href="/project/${project.id}">查看全文</a>
            </div>
          </article>
        `).join("");
      } catch (error) {
        container.innerHTML = `<div class="error">${error.message}</div>`;
      }
    }

    loadProjects();
  </script>
</body>
</html>
