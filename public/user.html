<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户主页 | Heisd.Stark</title>
  <style>
    :root {
      --bg: #f4efe7; --paper: rgba(255,253,247,0.92); --card: #fffdf8; --ink: #1f1f1f;
      --muted: #6b625b; --accent: #cc6a2d; --accent-dark: #8e4317; --line: #e5dbcf;
      --danger: #b91c1c; --shadow: 0 22px 50px rgba(68,48,30,0.08);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Georgia, "Times New Roman", serif; color: var(--ink); min-height: 100vh;
      background: radial-gradient(circle at top left, rgba(204,106,45,0.14), transparent 22%),
        radial-gradient(circle at bottom right, rgba(142,67,23,0.08), transparent 24%),
        linear-gradient(180deg, #f8f4ed 0%, var(--bg) 100%); }
    .topbar { position: sticky; top: 0; z-index: 20; backdrop-filter: blur(12px);
      background: rgba(248,244,237,0.78); border-bottom: 1px solid rgba(229,219,207,0.9); }
    .topbar-inner { max-width: 1000px; margin: 0 auto; padding: 18px 24px; display: flex;
      align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
    .brand { font-weight: 700; color: var(--accent-dark); text-decoration: none; letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.95rem; }
    .nav { display: flex; gap: 16px; flex-wrap: wrap; }
    .nav a { color: var(--muted); text-decoration: none; font-size: 0.96rem; font-weight: 700; }
    .nav a:hover { color: var(--accent-dark); }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 40px 24px 80px; }
    .panel { background: var(--card); border: 1px solid rgba(229,219,207,0.96); border-radius: 20px;
      box-shadow: var(--shadow); padding: 22px 24px; margin-bottom: 20px; }
    .button { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 20px; border-radius: 999px; border: none; cursor: pointer; font: inherit; font-weight: 700;
      text-decoration: none; color: var(--ink); transition: transform 180ms ease; }
    .button-primary { background: linear-gradient(120deg,#cc6a2d,#e0883f,#8e4317,#cc6a2d); background-size: 300% 100%; color: #fff; animation: btn-flow 6s ease infinite; }
    .button-secondary { background: rgba(255,255,255,0.85); border: 1px solid var(--line); }
    .button:hover { transform: translateY(-1px); }
    @keyframes btn-flow { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
    .msg { min-height: 18px; font-size: 0.9rem; line-height: 1.6; color: var(--muted); }
    .form-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

    .profile-hero { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
    .avatar-lg { width: 92px; height: 92px; border-radius: 50%; object-fit: cover; border: 1px solid var(--line); background: #f0ddc8; flex: none; }
    .pname { font-size: 1.7rem; font-weight: 800; color: var(--accent-dark); margin: 0; line-height: 1.1; }
    .pmeta { color: var(--muted); font-size: 0.9rem; margin: 6px 0 0; }
    .pbio { margin: 12px 0 0; color: var(--ink); line-height: 1.8; white-space: pre-wrap; word-break: break-word; }
    .stat-row { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0 0; }
    .stat { display: inline-flex; flex-direction: column; align-items: center; min-width: 76px; padding: 8px 14px;
      background: rgba(204,106,45,0.08); border: 1px solid var(--line); border-radius: 12px; }
    .stat b { font-size: 1.25rem; color: var(--accent-dark); line-height: 1; }
    .stat span { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }

    .sec-title { font-size: 1.2rem; margin: 6px 2px 14px; color: var(--accent-dark); }
    .post-card { background: var(--card); border: 1px solid rgba(229,219,207,0.96); border-radius: 18px;
      box-shadow: var(--shadow); padding: 18px 20px; margin-bottom: 14px; cursor: pointer; transition: transform 180ms ease, box-shadow 180ms ease; }
    .post-card:hover { transform: translateY(-3px); box-shadow: 0 24px 48px rgba(68,48,30,0.14); }
    .post-card h3 { margin: 0 0 8px; font-size: 1.2rem; line-height: 1.3; }
    .post-meta { font-size: 0.84rem; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
    .post-excerpt { margin: 0; color: var(--muted); line-height: 1.7; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; background: rgba(204,106,45,0.12); color: var(--accent-dark); font-size: 0.78rem; font-weight: 700; }
    .empty, .error, .loading { background: var(--paper); border: 1px dashed var(--line); border-radius: 18px;
      padding: 30px; color: var(--muted); line-height: 1.8; text-align: center; }
    .error { color: var(--danger); border-color: rgba(185,28,28,0.4); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">Heisd.Stark</a>
      <nav class="nav">
        <a href="/">首页</a>
        <a href="/projects">项目归档</a>
        <a href="/forum">论坛</a>
        <a href="/space">我的空间</a>
        <a href="/contact">联系我</a>
        <a href="/admin-login">进入后台</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="panel" id="auth-gate" hidden>
      <h2>请先登录账号</h2>
      <p class="msg">查看用户主页需要先登录。</p>
      <div class="form-actions">
        <a class="button button-primary" href="/welcome">去登录 / 注册 →</a>
        <a class="button button-secondary" href="/">返回首页</a>
      </div>
    </section>

    <div class="loading" id="checking">正在确认登录状态…</div>

    <div id="profile-main" hidden>
      <section class="panel" id="profile-hero-panel"></section>
      <h2 class="sec-title" id="posts-title">TA 发布的文章</h2>
      <div id="posts"></div>
    </section>
  </main>

  <script>
    const API_BASE = "https://myblogbackend-njns.onrender.com";
    const VISITOR_KEY = "visitorAccessToken";
    const ADMIN_KEY = "adminToken";
    const AVATAR_PH = "data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2064%2064%22%3E%3Crect%20width=%2264%22%20height=%2264%22%20fill=%22%23efe0cd%22/%3E%3Ccircle%20cx=%2232%22%20cy=%2225%22%20r=%2212%22%20fill=%22%23b88c5a%22/%3E%3Cpath%20d=%22M12%2058c0-12%2010-19%2020-19s20%207%2020%2019%22%20fill=%22%23b88c5a%22/%3E%3C/svg%3E";

    let currentUser = null;
    function token(k) { return localStorage.getItem(k); }
    function accessHeaders(extra) {
      const h = Object.assign({}, extra || {});
      const v = token(VISITOR_KEY); if (v) h["X-Access-Token"] = v;
      const a = token(ADMIN_KEY); if (a) h["Authorization"] = "Bearer " + a;
      return h;
    }
    function escapeHtml(t) {
      return String(t ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;");
    }
    function fmtDate(v) {
      if (!v) return ""; const d = new Date(v); if (isNaN(d.getTime())) return "";
      const p = (n) => String(n).padStart(2,"0");
      return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
    }
    function imgFallback(el) { el.onerror = null; el.src = AVATAR_PH; }
    function targetUsername() {
      const q = new URLSearchParams(location.search).get("u");
      if (q) return q;
      const m = location.pathname.match(/^\/u\/(.+)$/);
      return m ? decodeURIComponent(m[1]) : "";
    }

    const RETRY = [1500,2500,4000,6000,8000,10000];
    const COLD = new Set([502,503,504]);
    const delay = (ms) => new Promise((r) => setTimeout(r, ms));
    async function api(path, options = {}, { retries = 6, onWaking } = {}) {
      let last;
      for (let a = 0; ; a++) {
        try {
          const res = await fetch(API_BASE + path, options);
          const raw = await res.text(); let data = null;
          try { data = raw ? JSON.parse(raw) : null; } catch { data = null; }
          if (COLD.has(res.status) && data === null && a < retries) { if (onWaking) onWaking(a+1); await delay(RETRY[Math.min(a,RETRY.length-1)]); continue; }
          return { ok: res.ok, status: res.status, data };
        } catch (e) { last = e; if (a < retries) { if (onWaking) onWaking(a+1); await delay(RETRY[Math.min(a,RETRY.length-1)]); continue; } throw last; }
      }
    }
    async function loggedIn() {
      const v = token(VISITOR_KEY), a = token(ADMIN_KEY);
      try {
        if (v) { const r = await api("/api/access/verify", { headers: accessHeaders() }); if (r.ok && r.data && r.data.authenticated) return true; localStorage.removeItem(VISITOR_KEY); }
        if (a) { const r = await api("/api/auth/verify", { headers: accessHeaders() }); if (r.ok && r.data && r.data.authenticated) return true; localStorage.removeItem(ADMIN_KEY); }
      } catch {}
      return false;
    }

    function heroHtml(u) {
      const since = u.joinedAt ? `加入于 ${escapeHtml(fmtDate(u.joinedAt))}　·　` : "";
      return `
        <div class="profile-hero">
          <img class="avatar-lg" src="${escapeHtml(u.avatar || AVATAR_PH)}" alt="${escapeHtml(u.username)}" onerror="imgFallback(this)">
          <div style="flex:1 1 240px;">
            <h1 class="pname">${escapeHtml(u.username)}</h1>
            <p class="pmeta">${since}活跃创作者</p>
            <p class="pbio">${u.bio ? escapeHtml(u.bio) : "这位用户还没有填写自我介绍。"}</p>
            <div class="stat-row">
              <span class="stat"><b>${u.postCount || 0}</b><span>文章</span></span>
              <span class="stat"><b>${u.totalLikes || 0}</b><span>获赞</span></span>
              <span class="stat"><b>${u.totalReplies || 0}</b><span>讨论</span></span>
              <span class="stat"><b id="followers-n">${u.followers || 0}</b><span>粉丝</span></span>
              <span class="stat"><b>${u.following || 0}</b><span>关注</span></span>
            </div>
            ${u.canFollow ? `<div style="margin-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
              <button type="button" class="button ${u.isFollowing ? "button-secondary" : "button-primary"}" id="follow-btn">${u.isFollowing ? "已关注 ✓" : "+ 关注"}</button>
              ${u.canMessage
                ? `<a class="button button-secondary" href="/messages?to=${encodeURIComponent(u.username)}">✉ 私信</a>`
                : `<span class="msg" style="min-height:auto;">互相关注后可私信</span>`}
              <span class="msg" id="follow-msg" style="min-height:auto;"></span>
            </div>` : ""}
          </div>
        </div>`;
    }
    function postCardHtml(p) {
      return `
        <article class="post-card" data-id="${escapeHtml(p.id)}">
          <h3>${escapeHtml(p.title)}</h3>
          <div class="post-meta">
            <span>${escapeHtml(fmtDate(p.createdAt))}</span>
            <span class="badge">💬 ${p.replyCount || 0}</span>
            <span class="badge">♥ ${p.likeCount || 0}</span>
          </div>
          <p class="post-excerpt">${escapeHtml(p.excerpt || "")}</p>
        </article>`;
    }

    async function loadProfile() {
      const uname = targetUsername();
      const heroEl = document.getElementById("profile-hero-panel");
      const postsEl = document.getElementById("posts");
      if (!uname) { heroEl.innerHTML = `<div class="error">未指定用户。</div>`; return; }
      heroEl.innerHTML = `<div class="loading">正在加载主页…</div>`;
      try {
        const r = await api("/api/users/" + encodeURIComponent(uname), { headers: accessHeaders() }, {
          onWaking: (n) => { heroEl.innerHTML = `<div class="loading">服务器正在唤醒，请稍候…（第 ${n} 次重试）</div>`; },
        });
        if (r.status === 401) { window.location.href = "/welcome"; return; }
        if (r.status === 404) { heroEl.innerHTML = `<div class="error">用户「${escapeHtml(uname)}」不存在。</div>`; return; }
        if (!r.ok) throw new Error((r.data && r.data.message) || "加载失败。");
        const u = r.data.user, posts = r.data.posts || [];
        currentUser = u;
        document.title = `${u.username} 的主页 | Heisd.Stark`;
        heroEl.innerHTML = heroHtml(u);
        document.getElementById("posts-title").textContent = `${u.username} 发布的文章（${posts.length}）`;
        postsEl.innerHTML = posts.length ? posts.map(postCardHtml).join("") : `<div class="empty">这位用户还没有发布过文章。</div>`;
      } catch (e) {
        heroEl.innerHTML = `<div class="error">${escapeHtml(e.message)}</div>`;
      }
    }

    async function followToggle() {
      const btn = document.getElementById("follow-btn");
      if (!btn || !currentUser) return;
      btn.disabled = true;
      try {
        const r = await api("/api/users/" + encodeURIComponent(currentUser.username) + "/follow", { method: "POST", headers: accessHeaders() });
        if (r.status === 401) { window.location.href = "/welcome"; return; }
        if (!r.ok) { const m = document.getElementById("follow-msg"); if (m) { m.textContent = (r.data && r.data.message) || "操作失败。"; m.className = "msg error"; } btn.disabled = false; return; }
        currentUser.isFollowing = r.data.following;
        const fn = document.getElementById("followers-n"); if (fn) fn.textContent = r.data.followers;
        btn.textContent = r.data.following ? "已关注 ✓" : "+ 关注";
        btn.className = "button " + (r.data.following ? "button-secondary" : "button-primary");
        btn.disabled = false;
      } catch { btn.disabled = false; }
    }

    document.getElementById("posts").addEventListener("click", (e) => {
      const card = e.target.closest(".post-card");
      if (card) window.location.href = "/forum?post=" + encodeURIComponent(card.dataset.id);
    });
    document.getElementById("profile-hero-panel").addEventListener("click", (e) => {
      if (e.target.closest("#follow-btn")) followToggle();
    });

    (async function init() {
      const ok = await loggedIn();
      document.getElementById("checking").hidden = true;
      if (!ok) { document.getElementById("auth-gate").hidden = false; return; }
      document.getElementById("profile-main").hidden = false;
      await loadProfile();
    })();
  </script>
  <script src="/nav-auth.js" defer></script>
</body>
</html>
