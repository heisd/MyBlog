<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 / 注册 | Heisd.Stark 项目空间</title>
  <style>
    :root {
      --bg: #f4efe7;
      --paper: rgba(255, 253, 247, 0.92);
      --card: #fffdf8;
      --ink: #1f1f1f;
      --muted: #6b625b;
      --accent: #cc6a2d;
      --accent-dark: #8e4317;
      --line: #e5dbcf;
      --danger: #b91c1c;
      --shadow: 0 22px 50px rgba(68, 48, 30, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(204,106,45,0.16), transparent 24%),
        radial-gradient(circle at bottom right, rgba(142,67,23,0.1), transparent 26%),
        linear-gradient(180deg, #f8f4ed 0%, var(--bg) 100%);
      min-height: 100vh;
      transition: opacity 400ms ease;
    }
    body.leaving { opacity: 0; }
    .topbar {
      position: sticky; top: 0; z-index: 20;
      backdrop-filter: blur(12px);
      background: rgba(248, 244, 237, 0.78);
      border-bottom: 1px solid rgba(229, 219, 207, 0.9);
    }
    .topbar-inner {
      max-width: 1160px; margin: 0 auto; padding: 18px 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap;
    }
    .brand { font-weight: 700; color: var(--accent-dark); text-decoration: none; letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.95rem; }
    .nav { display: flex; gap: 16px; flex-wrap: wrap; }
    .nav a { color: var(--muted); text-decoration: none; font-size: 0.96rem; font-weight: 700; }
    .nav a:hover { color: var(--accent-dark); }
    .wrap { max-width: 560px; margin: 0 auto; padding: 70px 24px 60px; }
    .eyebrow { letter-spacing: 0.24em; text-transform: uppercase; color: var(--accent-dark); font-size: 12px; font-weight: 700; margin-bottom: 14px; text-align: center; }
    h1 { margin: 0 0 12px; font-size: clamp(2.2rem, 5vw, 3.2rem); line-height: 1.05; text-align: center; }
    .lead { margin: 0 auto 30px; color: var(--muted); max-width: 46ch; line-height: 1.85; text-align: center; }
    .auth-card {
      background: var(--paper);
      border: 1px solid rgba(229, 219, 207, 0.96);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 28px;
    }
    .tabs { display: flex; gap: 8px; background: rgba(229,219,207,0.5); padding: 5px; border-radius: 999px; margin-bottom: 22px; }
    .tabs button {
      flex: 1; border: none; background: none; padding: 10px; border-radius: 999px;
      font: inherit; font-weight: 700; color: var(--muted); cursor: pointer;
      transition: background-color 150ms ease, color 150ms ease;
    }
    .tabs button.active { background: #fff; color: var(--accent-dark); box-shadow: 0 4px 12px rgba(68,48,30,0.08); }
    .auth-form { display: grid; gap: 14px; }
    .auth-form label { font-weight: 700; font-size: 0.92rem; display: grid; gap: 6px; }
    .auth-form input[type="email"],
    .auth-form input[type="password"],
    .auth-form input[type="text"]:not(.hp) {
      width: 100%; padding: 13px 15px; border: 1px solid var(--line); border-radius: 12px;
      background: #fffefb; color: var(--ink); font: inherit; font-size: 1rem;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }
    .auth-form input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(204,106,45,0.14); }
    .code-row { display: flex; gap: 10px; }
    .code-row input { flex: 1; }
    .hp { position: absolute; left: -9999px; top: -9999px; width: 1px; height: 1px; opacity: 0; }
    .button {
      position: relative; overflow: hidden;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 14px 22px; border-radius: 999px; border: none; cursor: pointer;
      font: inherit; font-weight: 700; text-decoration: none;
      transition: transform 200ms ease, box-shadow 200ms ease, filter 200ms ease;
    }
    .button:disabled { opacity: 0.55; cursor: not-allowed; }
    .button-primary {
      background: linear-gradient(120deg, #cc6a2d, #e0883f, #8e4317, #cc6a2d);
      background-size: 300% 100%; color: #fff; animation: btn-flow 6s ease infinite;
    }
    .button-primary:not(:disabled):hover { transform: translateY(-2px) scale(1.01); box-shadow: 0 16px 32px rgba(204,106,45,0.4); filter: brightness(1.03); }
    .button-secondary { background: rgba(255,255,255,0.8); border: 1px solid var(--line); color: var(--ink); white-space: nowrap; }
    .button-secondary:not(:disabled):hover { transform: translateY(-1px); }
    @keyframes btn-flow { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
    .auth-msg { min-height: 20px; font-size: 0.92rem; line-height: 1.6; color: var(--muted); }
    .auth-msg.error { color: var(--danger); }
    .auth-msg.success { color: #2f6b30; }
    .hint { color: var(--muted); font-size: 0.85rem; line-height: 1.6; margin: 0; }
    .cf-holder { min-height: 0; }
    .entered { text-align: center; }
    .entered .who { color: var(--muted); margin-bottom: 18px; }
    .pay-panel { margin-top: 18px; text-align: left; }
    .pay-toggle {
      width: 100%; padding: 12px 16px; border-radius: 12px; cursor: pointer;
      background: #fff7ef; border: 1px dashed var(--accent); color: var(--accent-dark);
      font: inherit; font-weight: 800; transition: background 150ms ease;
    }
    .pay-toggle:hover { background: #ffedda; }
    .pay-body {
      margin-top: 14px; padding: 16px; border: 1px solid var(--line); border-radius: 14px;
      background: #fffdfa; display: grid; gap: 14px;
      animation: pay-in 260ms ease;
    }
    @keyframes pay-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
    .pay-tip { margin: 0; color: var(--muted); font-size: 0.92rem; line-height: 1.7; }
    .perks { width: 100%; border-collapse: collapse; font-size: 0.9rem; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .perks th, .perks td { padding: 9px 10px; text-align: center; border-bottom: 1px solid var(--line); }
    .perks thead th { background: #f7f1e8; color: var(--ink); font-weight: 800; }
    .perks tbody td:first-child, .perks thead th:first-child { text-align: left; color: var(--ink); }
    .perks tbody tr:last-child td { border-bottom: none; }
    .perks .col-vip { background: #fff6ec; }
    .perks thead .col-vip { color: var(--accent-dark); }
    .perks .yes { color: #2f6b30; font-weight: 800; }
    .perks .no { color: #b9aea2; }
    .plans { display: flex; gap: 10px; flex-wrap: wrap; }
    .plan {
      flex: 1 1 96px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 8px;
      text-align: center; cursor: pointer; background: #fff; transition: all 150ms ease;
    }
    .plan:hover { border-color: var(--accent); }
    .plan.active { border-color: var(--accent); background: #fff3e8; box-shadow: 0 0 0 3px rgba(204,106,45,0.14); }
    .plan .p-months { font-weight: 800; color: var(--ink); }
    .plan .p-price { color: var(--accent-dark); font-weight: 800; margin-top: 4px; }
    .qr-row { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
    .qr { margin: 0; text-align: center; }
    .qr img { width: 160px; height: 160px; object-fit: contain; border: 1px solid var(--line); border-radius: 12px; background: #fff; padding: 6px; }
    .qr figcaption { margin-top: 6px; color: var(--muted); font-size: 0.85rem; font-weight: 700; }
    .qr-empty { color: var(--muted); font-size: 0.86rem; text-align: center; line-height: 1.7; }
    .pay-note { margin: 0; color: var(--accent-dark); font-size: 0.88rem; font-weight: 700; }
    #pay-remark {
      width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px;
      background: #fffefb; color: var(--ink); font: inherit;
    }
    #pay-remark:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(204,106,45,0.14); }
    .pay-msg { min-height: 18px; font-size: 0.9rem; line-height: 1.6; margin: 0; color: var(--muted); }
    .pay-msg.error { color: var(--danger); }
    .pay-msg.success { color: #2f6b30; }
    .member-good { color: #2f6b30; font-weight: 700; }
    .entered .button { width: 100%; max-width: 320px; }
    .topnote {
      margin-top: 18px; padding: 12px 14px; border-radius: 12px;
      background: rgba(204,106,45,0.08); border: 1px solid rgba(204,106,45,0.25);
      color: var(--accent-dark); font-size: 0.86rem; line-height: 1.6;
    }
    .ripple { position: absolute; border-radius: 50%; transform: scale(0); background: rgba(255,255,255,0.5); animation: ripple-anim 600ms linear; pointer-events: none; }
    @keyframes ripple-anim { to { transform: scale(4); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      body, .button { transition: none; }
      .button-primary { animation: none; }
      .ripple { display: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">Heisd.Stark</a>
      <nav class="nav">
        <a href="/">首页</a>
        <a href="/contact">联系我</a>
        <a href="/admin-login">进入后台</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <div class="eyebrow">Project Space</div>
    <h1>欢迎来到项目空间</h1>
    <p class="lead">查看我的项目需要先登录。还没有账号？注册一个（邮箱验证 + 自设密码），之后即可浏览全部项目。</p>

    <div class="auth-card" id="gate">
      <div class="tabs">
        <button type="button" data-tab="login" class="active">登录</button>
        <button type="button" data-tab="register">注册</button>
      </div>

      <form id="login-form" class="auth-form" novalidate>
        <label>邮箱
          <input type="email" id="login-email" autocomplete="email" required>
        </label>
        <label>密码
          <input type="password" id="login-password" autocomplete="current-password" required>
        </label>
        <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="cf-holder" id="login-cf"></div>
        <button class="button button-primary" type="submit">登录</button>
        <div class="auth-msg" id="login-msg"></div>
      </form>

      <form id="register-form" class="auth-form" hidden novalidate>
        <label>邮箱
          <input type="email" id="reg-email" autocomplete="email" required>
        </label>
        <label>验证码
          <div class="code-row">
            <input type="text" id="reg-code" inputmode="numeric" maxlength="6" placeholder="6 位验证码" autocomplete="one-time-code">
            <button type="button" id="send-code" class="button button-secondary">发送验证码</button>
          </div>
        </label>
        <label>设置密码（≥ 8 位）
          <input type="password" id="reg-password" autocomplete="new-password" required>
        </label>
        <label>确认密码
          <input type="password" id="reg-password2" autocomplete="new-password" required>
        </label>
        <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="cf-holder" id="reg-cf"></div>
        <button class="button button-primary" type="submit">完成注册</button>
        <div class="auth-msg" id="reg-msg"></div>
      </form>

      <p class="hint" id="email-warn" style="margin-top:16px;"></p>
    </div>

    <div class="auth-card entered" id="entered" hidden>
      <p class="who" id="who"></p>
      <a class="button button-primary" href="/projects" id="enter-btn">进入项目归档 →</a>

      <div class="pay-panel" id="pay-panel" hidden>
        <button type="button" class="pay-toggle" id="pay-toggle">⭐ 开通 / 续费会员</button>
        <div class="pay-body" id="pay-body" hidden>
          <p class="pay-tip">开通会员即可解锁下列权益。扫码付款后点「我已付款」，管理员核对到账后为你开通。</p>

          <table class="perks">
            <thead><tr><th>权益</th><th>普通用户</th><th class="col-vip">会员</th></tr></thead>
            <tbody>
              <tr><td>浏览项目归档</td><td class="yes">✓</td><td class="yes col-vip">✓</td></tr>
              <tr><td>查看项目正文 / 演示视频</td><td class="yes">✓</td><td class="yes col-vip">✓</td></tr>
              <tr><td>站内只读浏览私有仓库源码</td><td class="no">—</td><td class="yes col-vip">✓</td></tr>
              <tr><td>悬浮 AI 助手</td><td class="no">—</td><td class="yes col-vip">✓</td></tr>
              <tr><td>优先解答 / 后续新功能</td><td class="no">—</td><td class="yes col-vip">✓</td></tr>
            </tbody>
          </table>

          <div class="plans" id="plans"></div>
          <div class="qr-row" id="qr-row">
            <figure class="qr" data-qr><img id="qr-wechat" alt="微信收款码" /><figcaption id="cap-wechat">微信扫码</figcaption></figure>
            <figure class="qr" data-qr><img id="qr-alipay" alt="支付宝收款码" /><figcaption id="cap-alipay">支付宝扫码</figcaption></figure>
          </div>
          <p class="qr-empty" id="qr-empty" hidden>收款码尚未配置。请联系管理员获取付款方式。</p>
          <p class="pay-note">付款时请在备注里填写你的登录邮箱，便于核对。</p>
          <input type="text" id="pay-remark" placeholder="可填：付款金额 / 订单号 / 留言（选填）" autocomplete="off" />
          <button type="button" class="button button-primary" id="pay-done">我已付款，通知管理员</button>
          <p class="pay-msg" id="pay-msg"></p>
        </div>
      </div>

      <p style="margin-top:14px;"><button type="button" id="logout-btn" class="button button-secondary">退出登录</button></p>
    </div>
  </main>

  <script>
    const API_BASE = "https://myblogbackend-njns.onrender.com";
    const TOKEN_KEY = "visitorAccessToken";
    // 会员套餐与价格（按需修改）。
    //  months = 月数；price = 展示价格；
    //  wechat / alipay = 该套餐「固定金额收款码」图片路径（放在 public/assets/）。
    //  没放固定金额码时会自动回退到通用码 pay-wechat.png / pay-alipay.png（需对方手动输金额）。
    const PLANS = [
      { months: 1,  price: "¥50",  wechat: "/assets/pay-wechat-50.png",  alipay: "/assets/pay-alipay-50.png" },
      { months: 3,  price: "¥150", wechat: "/assets/pay-wechat-150.png", alipay: "/assets/pay-alipay-150.png" },
      { months: 12, price: "¥600", wechat: "/assets/pay-wechat-600.png", alipay: "/assets/pay-alipay-600.png" },
    ];
    const QR_FALLBACK = { wechat: "/assets/pay-wechat.png", alipay: "/assets/pay-alipay.png" };
    let selectedPlan = PLANS[0];

    const gate = document.getElementById("gate");
    const entered = document.getElementById("entered");
    const loginForm = document.getElementById("login-form");
    const registerForm = document.getElementById("register-form");
    const loginMsg = document.getElementById("login-msg");
    const regMsg = document.getElementById("reg-msg");
    const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    let turnstileEnabled = false;
    let loginWidgetId = null;
    let regWidgetId = null;
    let currentFormToken = null;

    function setMsg(el, text, type = "") {
      el.textContent = text;
      el.className = "auth-msg" + (type ? " " + type : "");
    }

    function leaveTo(url) {
      if (reduceMotion) { window.location.href = url; return; }
      document.body.classList.add("leaving");
      setTimeout(() => { window.location.href = url; }, 380);
    }

    async function refreshFormToken() {
      try {
        const res = await fetch(`${API_BASE}/api/access/config`);
        const cfg = await res.json();
        currentFormToken = cfg.formToken || null;
      } catch {}
    }

    function humanPayload(which) {
      const form = which === "login" ? loginForm : registerForm;
      const website = form.querySelector('input[name="website"]').value || "";
      if (turnstileEnabled && window.turnstile) {
        const wid = which === "login" ? loginWidgetId : regWidgetId;
        const token = wid !== null ? window.turnstile.getResponse(wid) : "";
        return { website, turnstileToken: token };
      }
      const token = currentFormToken;
      refreshFormToken();
      return { website, formToken: token };
    }

    function resetTurnstile(which) {
      if (!turnstileEnabled || !window.turnstile) return;
      const wid = which === "login" ? loginWidgetId : regWidgetId;
      if (wid !== null) window.turnstile.reset(wid);
    }

    window.onTurnstileLoad = function () {
      loginWidgetId = window.turnstile.render("#login-cf", { sitekey: window.__siteKey });
      regWidgetId = window.turnstile.render("#reg-cf", { sitekey: window.__siteKey });
    };

    async function initHuman() {
      try {
        const cfg = await (await fetch(`${API_BASE}/api/access/config`)).json();
        if (!cfg.emailConfigured) {
          document.getElementById("email-warn").textContent =
            "提示：邮件服务尚未配置/未验证域名，注册验证码可能无法送达，请联系站长。";
        }
        if (cfg.turnstileSiteKey) {
          turnstileEnabled = true;
          window.__siteKey = cfg.turnstileSiteKey;
          const s = document.createElement("script");
          s.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstileLoad";
          s.async = true;
          s.defer = true;
          document.head.appendChild(s);
        } else {
          currentFormToken = cfg.formToken || null;
        }
      } catch {}
    }

    // 标签切换
    document.querySelectorAll(".tabs button").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("active", b === btn));
        const isLogin = btn.dataset.tab === "login";
        loginForm.hidden = !isLogin;
        registerForm.hidden = isLogin;
      });
    });

    // 发送验证码
    const sendCodeBtn = document.getElementById("send-code");
    let cooldownTimer = null;
    function startCooldown(seconds) {
      let left = seconds;
      sendCodeBtn.disabled = true;
      sendCodeBtn.textContent = `${left}s 后重发`;
      cooldownTimer = setInterval(() => {
        left -= 1;
        if (left <= 0) { clearInterval(cooldownTimer); sendCodeBtn.disabled = false; sendCodeBtn.textContent = "发送验证码"; }
        else sendCodeBtn.textContent = `${left}s 后重发`;
      }, 1000);
    }

    sendCodeBtn.addEventListener("click", async () => {
      const email = document.getElementById("reg-email").value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setMsg(regMsg, "请输入有效的邮箱地址。", "error"); return; }
      setMsg(regMsg, "正在发送验证码…");
      sendCodeBtn.disabled = true;
      try {
        const res = await fetch(`${API_BASE}/api/access/register/request-code`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, ...humanPayload("register") }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) { setMsg(regMsg, data.message || "发送失败，请稍后再试。", "error"); sendCodeBtn.disabled = false; resetTurnstile("register"); return; }
        setMsg(regMsg, data.message || "验证码已发送，请查收邮箱。", "success");
        startCooldown(data.cooldown || 60);
        resetTurnstile("register");
      } catch {
        setMsg(regMsg, "网络异常，请稍后再试。", "error");
        sendCodeBtn.disabled = false;
      }
    });

    // 注册提交
    registerForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const email = document.getElementById("reg-email").value.trim();
      const code = document.getElementById("reg-code").value.trim();
      const pw = document.getElementById("reg-password").value;
      const pw2 = document.getElementById("reg-password2").value;
      if (!/^\d{6}$/.test(code)) { setMsg(regMsg, "请输入 6 位验证码。", "error"); return; }
      if (pw.length < 8) { setMsg(regMsg, "密码至少 8 位。", "error"); return; }
      if (pw !== pw2) { setMsg(regMsg, "两次输入的密码不一致。", "error"); return; }
      const submitBtn = registerForm.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      setMsg(regMsg, "正在注册…");
      try {
        const res = await fetch(`${API_BASE}/api/access/register`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, code, password: pw }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) { setMsg(regMsg, data.message || "注册失败。", "error"); submitBtn.disabled = false; return; }
        localStorage.setItem(TOKEN_KEY, data.token);
        setMsg(regMsg, "注册成功，正在进入…", "success");
        leaveTo("/projects");
      } catch {
        setMsg(regMsg, "网络异常，请稍后再试。", "error");
        submitBtn.disabled = false;
      }
    });

    // 登录提交
    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const email = document.getElementById("login-email").value.trim();
      const pw = document.getElementById("login-password").value;
      if (!email || !pw) { setMsg(loginMsg, "请输入邮箱和密码。", "error"); return; }
      const submitBtn = loginForm.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      setMsg(loginMsg, "正在登录…");
      try {
        const res = await fetch(`${API_BASE}/api/access/login`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password: pw, ...humanPayload("login") }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) { setMsg(loginMsg, data.message || "登录失败。", "error"); submitBtn.disabled = false; resetTurnstile("login"); return; }
        localStorage.setItem(TOKEN_KEY, data.token);
        setMsg(loginMsg, "登录成功，正在进入…", "success");
        leaveTo("/projects");
      } catch {
        setMsg(loginMsg, "网络异常，请稍后再试。", "error");
        submitBtn.disabled = false;
        resetTurnstile("login");
      }
    });

    // 已登录则直接显示「进入项目归档」
    async function checkSession() {
      const token = localStorage.getItem(TOKEN_KEY);
      if (!token) return;
      try {
        const res = await fetch(`${API_BASE}/api/access/verify`, { headers: { "X-Access-Token": token } });
        if (!res.ok) { localStorage.removeItem(TOKEN_KEY); return; }
        const data = await res.json();
        let who = `已登录：${data.email}`;
        if (data.member) {
          const until = data.memberUntil ? new Date(data.memberUntil).toLocaleDateString("zh-CN") : "";
          who += `　·　会员${until ? `（${until} 到期）` : ""}`;
        } else {
          who += "　·　普通用户（开通会员可看私有仓库源码 + AI 助手）";
        }
        document.getElementById("who").textContent = who;
        setupPayPanel(Boolean(data.member));
        gate.hidden = true;
        entered.hidden = false;
      } catch {}
    }

    // 支付面板：渲染套餐 + 收款码可用性检测 + 会员/续费文案
    function setupPayPanel(isMember) {
      const panel = document.getElementById("pay-panel");
      const toggle = document.getElementById("pay-toggle");
      toggle.textContent = isMember ? "⭐ 续费会员" : "⭐ 开通会员";
      panel.hidden = false;

      const plansEl = document.getElementById("plans");
      if (!plansEl.dataset.ready) {
        plansEl.innerHTML = PLANS.map((p, i) =>
          `<div class="plan${i === 0 ? " active" : ""}" data-i="${i}">
             <div class="p-months">${p.months} 个月</div>
             <div class="p-price">${p.price}</div>
           </div>`
        ).join("");
        plansEl.addEventListener("click", (e) => {
          const el = e.target.closest(".plan");
          if (!el) return;
          plansEl.querySelectorAll(".plan").forEach((n) => n.classList.remove("active"));
          el.classList.add("active");
          selectedPlan = PLANS[Number(el.dataset.i)] || PLANS[0];
          updateQRs();
        });
        plansEl.dataset.ready = "1";
        updateQRs();
      }
    }

    // 按所选套餐显示对应的「固定金额收款码」；图片缺失时回退到通用码，再缺失则隐藏。
    function applyQR(imgId, capId, label, primary, fallback) {
      const img = document.getElementById(imgId);
      const fig = img.closest("[data-qr]");
      document.getElementById(capId).textContent = `${label} · ${selectedPlan.price}`;
      fig.hidden = false;
      img.onerror = () => {
        if (img.dataset.fb !== "1" && fallback) {
          img.dataset.fb = "1";
          img.src = fallback;
        } else {
          fig.hidden = true;
          refreshQrEmpty();
        }
      };
      img.dataset.fb = "";
      img.src = primary || fallback || "";
      refreshQrEmpty();
    }
    function refreshQrEmpty() {
      const left = document.querySelectorAll("#qr-row [data-qr]:not([hidden])").length;
      document.getElementById("qr-row").hidden = left === 0;
      document.getElementById("qr-empty").hidden = left !== 0;
    }
    function updateQRs() {
      applyQR("qr-wechat", "cap-wechat", "微信扫码", selectedPlan.wechat, QR_FALLBACK.wechat);
      applyQR("qr-alipay", "cap-alipay", "支付宝扫码", selectedPlan.alipay, QR_FALLBACK.alipay);
    }

    function setPayMsg(text, type = "") {
      const el = document.getElementById("pay-msg");
      el.textContent = text;
      el.className = "pay-msg" + (type ? " " + type : "");
    }

    document.getElementById("pay-toggle").addEventListener("click", () => {
      const body = document.getElementById("pay-body");
      body.hidden = !body.hidden;
    });

    document.getElementById("pay-done").addEventListener("click", async () => {
      const btn = document.getElementById("pay-done");
      const token = localStorage.getItem(TOKEN_KEY);
      if (!token) { setPayMsg("登录状态已失效，请重新登录。", "error"); return; }
      btn.disabled = true;
      setPayMsg("正在通知管理员…", "");
      try {
        const res = await fetch(`${API_BASE}/api/access/payment-notify`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Access-Token": token },
          body: JSON.stringify({
            plan: `${selectedPlan.months} 个月 / ${selectedPlan.price}`,
            note: document.getElementById("pay-remark").value || "",
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.message || "提交失败，请稍后再试。");
        setPayMsg("已通知管理员 ✓ 核对到账后会为你开通，请稍后刷新查看会员状态。", "success");
        document.getElementById("pay-remark").value = "";
      } catch (e) {
        setPayMsg(e.message, "error");
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById("enter-btn").addEventListener("click", (event) => {
      event.preventDefault();
      leaveTo("/projects");
    });
    document.getElementById("logout-btn").addEventListener("click", () => {
      localStorage.removeItem(TOKEN_KEY);
      entered.hidden = true;
      gate.hidden = false;
    });

    // 点击涟漪
    document.addEventListener("click", function (event) {
      if (reduceMotion) return;
      const target = event.target.closest(".button");
      if (!target) return;
      const rect = target.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      const ripple = document.createElement("span");
      ripple.className = "ripple";
      ripple.style.width = ripple.style.height = `${size}px`;
      ripple.style.left = `${event.clientX - rect.left - size / 2}px`;
      ripple.style.top = `${event.clientY - rect.top - size / 2}px`;
      target.appendChild(ripple);
      ripple.addEventListener("animationend", () => ripple.remove());
    });

    initHuman();
    checkSession();
  </script>
</body>
</html>
