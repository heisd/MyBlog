<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Detail</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --paper: #ffffff;
      --ink: #1f2328;
      --muted: #606a75;
      --line: #e2e8f0;
      --accent: #185adb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(180deg, #f8fafc 0%, var(--bg) 100%);
      color: var(--ink);
    }
    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 32px 24px 60px;
    }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
      margin-bottom: 20px;
    }
    .cover {
      width: 100%;
      height: min(46vw, 420px);
      object-fit: cover;
      border-radius: 26px;
      border: 1px solid var(--line);
      box-shadow: 0 20px 44px rgba(15, 23, 42, 0.08);
      margin-bottom: 28px;
    }
    article {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 26px;
      padding: 36px;
      box-shadow: 0 18px 42px rgba(15, 23, 42, 0.05);
    }
    .meta {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 10px;
    }
    h1 {
      margin: 0 0 18px;
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1.08;
    }
    .summary {
      font-size: 1.08rem;
      line-height: 1.8;
      color: var(--muted);
      border-left: 4px solid #dbeafe;
      padding-left: 18px;
      margin-bottom: 30px;
    }
    .content {
      line-height: 1.9;
      color: #313944;
    }
    .content h3 {
      margin-top: 28px;
      margin-bottom: 10px;
      font-size: 1.25rem;
    }
    .state {
      background: white;
      border: 1px dashed var(--line);
      border-radius: 18px;
      padding: 24px;
      color: var(--muted);
    }
    @media (max-width: 640px) {
      article {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="back" href="/projects">&larr; Back to projects</a>
    <div id="project-root" class="state">Loading project...</div>
  </main>

  <script>
    function getProjectId() {
      const parts = window.location.pathname.split("/").filter(Boolean);
      return parts[parts.length - 1];
    }

    async function loadProject() {
      const root = document.getElementById("project-root");
      const id = getProjectId();

      try {
        const response = await fetch(`/api/projects/${id}`);
        if (!response.ok) {
          throw new Error(response.status === 404 ? "Project not found." : "Failed to load project.");
        }
        const project = await response.json();

        root.className = "";
        root.innerHTML = `
          <img class="cover" src="${project.coverImage}" alt="${project.title}">
          <article>
            <div class="meta">${project.date}</div>
            <h1>${project.title}</h1>
            <div class="summary">${project.summary}</div>
            <div class="content">${project.content}</div>
          </article>
        `;
      } catch (error) {
        root.className = "state";
        root.textContent = error.message;
      }
    }

    loadProject();
  </script>
</body>
</html>
