<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目详情 | Heisd.Stark</title>
  <!-- KaTeX：数学公式渲染（CDN，加载失败时公式降级为源码文本） -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
  <!-- highlight.js：源码语法高亮（CDN，加载失败时降级为纯文本） -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/styles/atom-one-dark.min.css" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #f4efe7;
      --paper: rgba(255, 253, 247, 0.94);
      --card: #fffdf8;
      --ink: #1f1f1f;
      --muted: #6b625b;
      --accent: #cc6a2d;
      --accent-dark: #8e4317;
      --line: #e5dbcf;
      --shadow: 0 22px 50px rgba(68, 48, 30, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(204,106,45,0.14), transparent 22%),
        radial-gradient(circle at bottom right, rgba(142,67,23,0.08), transparent 24%),
        linear-gradient(180deg, #f8f4ed 0%, var(--bg) 100%);
      min-height: 100vh;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(12px);
      background: rgba(248, 244, 237, 0.78);
      border-bottom: 1px solid rgba(229, 219, 207, 0.9);
    }
    .topbar-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
    }
    .brand {
      font-weight: 700;
      color: var(--accent-dark);
      text-decoration: none;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.95rem;
    }
    .nav { display: flex; gap: 16px; flex-wrap: wrap; }
    .nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.96rem;
      font-weight: 700;
    }
    .nav a:hover { color: var(--accent-dark); }
    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 36px 24px 70px;
    }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--accent-dark);
      font-weight: 700;
      text-decoration: none;
      margin-bottom: 22px;
      transition: color 160ms ease, transform 160ms ease;
    }
    .back:hover { color: var(--accent); transform: translateX(-4px); }
    .cover {
      width: 100%;
      height: min(46vw, 420px);
      object-fit: cover;
      border-radius: 26px;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      margin-bottom: 28px;
    }
    article {
      background: var(--paper);
      border: 1px solid rgba(229, 219, 207, 0.96);
      border-radius: 26px;
      padding: 40px;
      box-shadow: var(--shadow);
    }
    .meta {
      color: var(--muted);
      font-size: 0.9rem;
      letter-spacing: 0.04em;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1.08;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 22px;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(204,106,45,0.14);
      color: var(--accent-dark);
      font-size: 0.86rem;
      font-weight: 700;
      text-decoration: none;
      transition: background-color 150ms ease, transform 150ms ease;
    }
    .tag:hover { background: rgba(204,106,45,0.24); transform: translateY(-1px); }
    .summary {
      font-size: 1.1rem;
      line-height: 1.85;
      color: var(--muted);
      border-left: 4px solid var(--accent);
      padding-left: 18px;
      margin-bottom: 28px;
    }
    .repo-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 18px;
      border-radius: 12px;
      background: #1f2328;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.96rem;
      margin-bottom: 30px;
      transition: transform 160ms ease, box-shadow 160ms ease, background-color 160ms ease;
    }
    .repo-link:hover {
      transform: translateY(-2px);
      background: #000;
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.25);
    }
    .repo-link svg { width: 18px; height: 18px; }
    .repo-locked {
      display: inline-block;
      padding: 11px 16px;
      border-radius: 12px;
      background: rgba(107, 98, 91, 0.1);
      border: 1px dashed var(--line);
      color: var(--muted);
      font-size: 0.96rem;
      margin-bottom: 30px;
    }
    .repo-locked strong { color: var(--accent-dark); }
    .repo-cta {
      display: inline-flex; align-items: center; gap: 6px; margin-left: 10px;
      padding: 8px 16px; border-radius: 999px; text-decoration: none; font-weight: 700; font-size: 0.92rem;
      background: linear-gradient(135deg, #cc6a2d, #8e4317); color: #fff;
      box-shadow: 0 8px 20px rgba(204,106,45,.36); transition: transform 160ms ease, box-shadow 160ms ease;
    }
    .repo-cta:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 12px 26px rgba(204,106,45,.46); }
    .cv-overlay {
      position: fixed; inset: 0; z-index: 60;
      background: rgba(15, 23, 42, 0.5);
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .cv-overlay.open { display: flex; }
    .cv {
      width: min(1000px, 96vw); height: min(82vh, 760px);
      background: #fffdf8; border: 1px solid var(--line); border-radius: 18px;
      box-shadow: 0 30px 60px rgba(15, 23, 42, 0.35);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .cv-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); background: rgba(204,106,45,.06); }
    .cv-head b { color: var(--accent-dark); }
    .cv-note { color: var(--muted); font-size: .82rem; }
    .cv-close { margin-left: auto; border: none; background: none; font-size: 24px; line-height: 1; color: var(--muted); cursor: pointer; }
    .cv-main { flex: 1; display: grid; grid-template-columns: 280px 1fr; min-height: 0; }
    .cv-side { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: #f8f4ed; }
    .cv-side input { margin: 12px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; background: #fffefb; }
    .cv-side input:focus { outline: none; border-color: var(--accent); }
    .cv-files { flex: 1; overflow-y: auto; padding: 8px; }
    .cv-row {
      display: flex; align-items: center; gap: 6px; width: 100%; text-align: left;
      border: none; background: none; border-radius: 8px; cursor: pointer; user-select: none;
      padding: 5px 10px; font-family: "SFMono-Regular", Consolas, monospace;
      font-size: .82rem; color: var(--ink);
    }
    .cv-row:hover { background: rgba(204,106,45,.08); }
    .cv-twisty { flex: none; width: 12px; text-align: center; font-size: .58rem; color: var(--muted); transition: transform .15s ease; }
    .cv-dir.open > .cv-twisty { transform: rotate(90deg); }
    .cv-icon { flex: none; font-size: .9rem; line-height: 1; }
    .cv-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cv-dir > .cv-name { font-weight: 600; }
    .cv-file.active { background: rgba(204,106,45,.16); color: var(--accent-dark); }
    .cv-file.active .cv-name { font-weight: 700; }
    .cv-children { display: none; }
    .cv-children.open { display: block; }
    .cv-empty { color: var(--muted); padding: 12px 14px; font-size: .85rem; }
    .cv-content { display: flex; flex-direction: column; min-height: 0; }
    .cv-path { padding: 10px 16px; border-bottom: 1px solid var(--line); color: var(--muted); font-family: "SFMono-Regular", Consolas, monospace; font-size: .82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cv-code { flex: 1; margin: 0; overflow: auto; padding: 16px; background: #2b2722; color: #f4efe7; font-family: "SFMono-Regular", Consolas, monospace; font-size: .86rem; line-height: 1.6; white-space: pre; }
    .cv-loading { color: var(--muted); padding: 16px; font-size: .9rem; }
    @media (max-width: 720px) {
      .cv-main { grid-template-columns: 1fr; grid-template-rows: 38% 62%; }
      .cv-side { border-right: none; border-bottom: 1px solid var(--line); }
    }
    @media (prefers-reduced-motion: reduce) {
      .repo-link { transition: none; }
      .repo-link:hover { transform: none; }
      .cv-twisty { transition: none; }
    }
    .video-panel {
      margin-bottom: 30px;
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 20px;
    }
    .video-panel h2 { margin: 0 0 14px; font-size: 1.2rem; }
    .video-frame,
    .video-player {
      width: 100%;
      border: none;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      aspect-ratio: 16 / 9;
    }
    .content {
      line-height: 1.95;
      color: #2c2722;
      font-size: 1.05rem;
    }
    .content h1, .content h2, .content h3, .content h4 {
      line-height: 1.3;
      margin: 30px 0 12px;
      scroll-margin-top: 92px;
    }
    .content h2 { font-size: 1.5rem; }
    .content h3 { font-size: 1.25rem; }
    .content p { margin: 0 0 16px; }
    .content a { color: var(--accent-dark); }
    .content img {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      border: 1px solid var(--line);
      margin: 12px 0;
    }
    .content ul, .content ol { padding-left: 22px; line-height: 1.85; }
    .content blockquote {
      margin: 16px 0;
      padding: 8px 18px;
      border-left: 4px solid var(--line);
      color: var(--muted);
    }
    .content pre {
      background: #2b2722;
      color: #f4efe7;
      padding: 16px;
      border-radius: 12px;
      overflow: auto;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 0.92rem;
    }
    .content code {
      background: rgba(204,106,45,0.1);
      padding: 2px 6px;
      border-radius: 6px;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 0.92em;
    }
    .content pre code { background: none; padding: 0; }
    .content table { border-collapse: collapse; width: 100%; margin: 16px 0; }
    .content th, .content td { border: 1px solid var(--line); padding: 8px 12px; text-align: left; }
    /* 特殊语法样式 */
    .content ul.task-list { list-style: none; padding-left: 4px; }
    .content .task-list-item { list-style: none; }
    .content .task-list-item input { margin-right: 8px; vertical-align: middle; }
    .content mark { background: #fff3a3; padding: 0 3px; border-radius: 3px; }
    .content sup.footnote-ref a { text-decoration: none; color: var(--accent-dark); }
    .content .footnotes { margin-top: 30px; font-size: 0.9em; color: var(--muted); }
    .content .footnotes hr { border: none; border-top: 1px solid var(--line); margin: 14px 0; }
    .content .footnote-backref { text-decoration: none; }
    .content .math-block { overflow-x: auto; text-align: center; }
    .content nav.toc {
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px 20px;
      margin: 0 0 24px;
    }
    .content nav.toc strong { color: var(--accent-dark); display: block; margin-bottom: 8px; }
    .content nav.toc ul { list-style: none; padding-left: 0; }
    .content nav.toc a { color: var(--muted); text-decoration: none; }
    .content nav.toc a:hover { color: var(--accent-dark); }
    .state {
      background: var(--paper);
      border: 1px dashed var(--line);
      border-radius: 20px;
      padding: 28px;
      color: var(--muted);
      line-height: 1.8;
      text-align: center;
    }
    body { transition: opacity 400ms ease; }
    body.leaving { opacity: 0; }
    .pager {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 28px;
    }
    .pager-link {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 20px 24px;
      background: var(--card);
      border: 1px solid rgba(229, 219, 207, 0.96);
      border-radius: 20px;
      text-decoration: none;
      color: var(--ink);
      box-shadow: var(--shadow);
      transition: transform 200ms ease, box-shadow 200ms ease, border-color 200ms ease;
    }
    .pager-link.next { text-align: right; align-items: flex-end; }
    .pager-link:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 28px 52px rgba(68, 48, 30, 0.16);
    }
    .pager-link .dir {
      color: var(--accent-dark);
      font-weight: 700;
      font-size: 0.88rem;
      letter-spacing: 0.02em;
      transition: transform 200ms ease;
    }
    .pager-link.prev:hover .dir { transform: translateX(-5px); }
    .pager-link.next:hover .dir { transform: translateX(5px); }
    .pager-link .ptitle {
      font-size: 1.12rem;
      font-weight: 700;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .pager-empty { display: none; }
    .pager-hint {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 14px;
    }
    .progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 4px;
      width: 0;
      background: linear-gradient(90deg, #cc6a2d, #e0883f);
      box-shadow: 0 0 8px rgba(204, 106, 45, 0.5);
      z-index: 40;
      transition: width 90ms linear;
    }
    .toc-panel {
      position: fixed;
      top: 110px;
      left: calc(50% + 470px);
      width: 210px;
      max-height: 72vh;
      overflow-y: auto;
      padding: 16px 14px 16px 16px;
      background: var(--paper);
      border: 1px solid rgba(229, 219, 207, 0.96);
      border-radius: 16px;
      box-shadow: var(--shadow);
      display: none;
    }
    .toc-title {
      font-weight: 700;
      color: var(--accent-dark);
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .toc-link {
      display: block;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.92rem;
      line-height: 1.5;
      padding: 5px 8px;
      border-radius: 8px;
      border-left: 2px solid transparent;
      transition: color 150ms ease, background-color 150ms ease, border-color 150ms ease;
    }
    .toc-link:hover { color: var(--accent-dark); background: rgba(204, 106, 45, 0.08); }
    .toc-link.active {
      color: var(--accent-dark);
      background: rgba(204, 106, 45, 0.12);
      border-left-color: var(--accent);
      font-weight: 700;
    }
    .toc-link.lvl-3 { padding-left: 20px; font-size: 0.86rem; }
    .toc-fab {
      position: fixed;
      right: 18px;
      bottom: 86px;
      z-index: 45;
      display: none;
      align-items: center;
      gap: 6px;
      padding: 12px 18px;
      border-radius: 999px;
      border: none;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 26px rgba(204, 106, 45, 0.45);
      transition: transform 150ms ease, box-shadow 150ms ease;
    }
    .toc-fab:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(204, 106, 45, 0.5); }
    .toc-fab:active { transform: translateY(0) scale(0.97); }
    .toc-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.42);
      z-index: 44;
      opacity: 0;
      pointer-events: none;
      transition: opacity 250ms ease;
    }
    .toc-backdrop.open { opacity: 1; pointer-events: auto; }
    .toc-close { display: none; }
    @media (min-width: 1340px) {
      .toc-panel.show { display: block; }
    }
    @media (max-width: 1339px) {
      .toc-panel.show {
        display: block;
        position: fixed;
        top: 0;
        right: 0;
        left: auto;
        width: min(84vw, 320px);
        height: 100%;
        max-height: 100%;
        border-radius: 18px 0 0 18px;
        padding-top: 54px;
        transform: translateX(106%);
        transition: transform 280ms ease;
        z-index: 46;
      }
      .toc-panel.show.open { transform: translateX(0); }
      .toc-fab.show { display: inline-flex; }
      .toc-close {
        display: flex;
        align-items: center;
        justify-content: center;
        position: absolute;
        top: 12px;
        right: 12px;
        width: 32px;
        height: 32px;
        border: none;
        border-radius: 50%;
        background: rgba(17, 24, 39, 0.08);
        color: var(--ink);
        font-size: 20px;
        line-height: 1;
        cursor: pointer;
      }
    }
    @media (max-width: 600px) {
      .pager { grid-template-columns: 1fr; }
      .pager-link.next { text-align: left; align-items: flex-start; }
      .pager-empty { display: none; }
    }
    @media (max-width: 640px) {
      article { padding: 26px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .back, .tag, .pager-link, .pager-link .dir, .toc-link, body { transition: none; }
      .back:hover, .tag:hover, .pager-link:hover { transform: none; }
      .pager-link.prev:hover .dir, .pager-link.next:hover .dir { transform: none; }
      .progress-bar, .toc-backdrop, .toc-fab { transition: none; }
      .toc-panel.show { transition: none; }
    }
  </style>
</head>
<body>
  <div class="progress-bar" id="progress-bar"></div>
  <aside class="toc-panel" id="toc-panel" aria-label="目录"></aside>
  <button class="toc-fab" id="toc-fab" type="button" aria-label="打开目录">☰ 目录</button>
  <div class="toc-backdrop" id="toc-backdrop"></div>

  <div class="cv-overlay" id="cv-overlay">
    <div class="cv">
      <div class="cv-head">
        <b id="cv-title">源码浏览</b>
        <span class="cv-note">只读 · 不支持下载 / clone</span>
        <button class="cv-close" id="cv-close" type="button" aria-label="关闭">×</button>
      </div>
      <div class="cv-main">
        <div class="cv-side">
          <input id="cv-filter" type="text" placeholder="筛选文件…" autocomplete="off">
          <div class="cv-files" id="cv-files"></div>
        </div>
        <div class="cv-content">
          <div class="cv-path" id="cv-path">← 从左侧选择一个文件查看</div>
          <pre class="cv-code" id="cv-code"></pre>
        </div>
      </div>
    </div>
  </div>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">Heisd.Stark</a>
      <nav class="nav">
        <a href="/">首页</a>
        <a href="/projects">项目归档</a>
        <a href="/contact">联系我</a>
        <a href="/admin-login">进入后台</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <a class="back" href="/projects">← 返回项目列表</a>
    <div id="project-root" class="state">正在加载项目...</div>
  </main>

  <script>
    const API_BASE = "https://myblogbackend-njns.onrender.com";
    const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let prevUrl = null;
    let nextUrl = null;

    function leaveTo(url) {
      if (!url) return;
      if (reduceMotion) {
        window.location.href = url;
        return;
      }
      document.body.classList.add("leaving");
      setTimeout(() => { window.location.href = url; }, 400);
    }

    function accessHeaders() {
      const headers = {};
      const visitor = localStorage.getItem("visitorAccessToken");
      if (visitor) headers["X-Access-Token"] = visitor;
      const admin = localStorage.getItem("adminToken");
      if (admin) headers["Authorization"] = `Bearer ${admin}`;
      return headers;
    }

    function getProjectId() {
      const params = new URLSearchParams(window.location.search);
      const queryId = params.get("id");
      if (queryId) return queryId;
      const parts = window.location.pathname.split("/").filter(Boolean);
      return parts[parts.length - 1];
    }

    function escapeHtml(text) {
      return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    // KaTeX 数学公式渲染（可选增强，失败/未加载则降级显示源码）
    function renderMath(el) {
      if (!el || typeof window.renderMathInElement !== "function") return;
      try {
        window.renderMathInElement(el, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false },
          ],
          throwOnError: false,
          ignoredTags: ["script", "noscript", "style", "textarea", "pre", "code"],
        });
      } catch (e) { /* 降级：保留源码 */ }
    }
    // KaTeX 脚本异步加载完成后，补渲染一次正文
    window.addEventListener("load", () => renderMath(document.querySelector(".content")));

    function delay(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    const RETRY_DELAYS = [1500, 2500, 4000, 6000, 8000, 10000];
    const COLD_START_STATUSES = new Set([502, 503, 504]);

    async function fetchWithWake(url, { retries = 6, onWaking } = {}) {
      let lastError;
      for (let attempt = 0; ; attempt++) {
        try {
          const response = await fetch(url, { headers: accessHeaders() });
          const raw = await response.text();
          let data = null;
          try { data = raw ? JSON.parse(raw) : null; } catch { data = null; }
          const looksColdStart = COLD_START_STATUSES.has(response.status) && data === null;
          if (looksColdStart && attempt < retries) {
            if (onWaking) onWaking(attempt + 1);
            await delay(RETRY_DELAYS[Math.min(attempt, RETRY_DELAYS.length - 1)]);
            continue;
          }
          return { ok: response.ok, status: response.status, data };
        } catch (error) {
          lastError = error;
          if (attempt < retries) {
            if (onWaking) onWaking(attempt + 1);
            await delay(RETRY_DELAYS[Math.min(attempt, RETRY_DELAYS.length - 1)]);
            continue;
          }
          throw lastError;
        }
      }
    }

    function renderTags(tags) {
      const list = Array.isArray(tags) ? tags.filter(Boolean) : [];
      if (!list.length) return "";
      return `<div class="tags">${list
        .map((tag) => `<a class="tag" href="/projects?tag=${encodeURIComponent(tag)}">${escapeHtml(tag)}</a>`)
        .join("")}</div>`;
    }

    function renderRepo(project) {
      if (project.repoUrl) {
        return `<div><button type="button" class="repo-link" id="browse-source">
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg>
          浏览源码（站内只读）
        </button></div>`;
      }
      if (project.repoLocked) {
        return `<div class="repo-locked">🔒 该项目源码仓库为私有，仅 <strong>会员</strong> 可见。<a class="repo-cta" href="/welcome">⭐ 去开通会员 →</a></div>`;
      }
      return "";
    }

    function renderVideo(videoUrl) {
      if (!videoUrl) return "";
      const safeUrl = escapeHtml(videoUrl);
      const isDirectVideo = /\.(mp4|webm|ogg)(\?.*)?$/i.test(videoUrl);
      if (isDirectVideo) {
        return `
          <section class="video-panel">
            <h2>项目演示视频</h2>
            <video class="video-player" controls playsinline src="${safeUrl}"></video>
          </section>`;
      }
      return `
        <section class="video-panel">
          <h2>项目演示视频</h2>
          <iframe class="video-frame" src="${safeUrl}" title="项目演示视频"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen></iframe>
        </section>`;
    }

    async function loadProject() {
      const root = document.getElementById("project-root");
      const id = getProjectId();

      try {
        const result = await fetchWithWake(`${API_BASE}/api/projects/${encodeURIComponent(id)}`, {
          onWaking: (n) => {
            root.className = "state";
            root.textContent = `服务器正在唤醒，请稍候…（第 ${n} 次重试）`;
          },
        });

        if (result.status === 401) {
          window.location.href = "/welcome";
          return;
        }
        if (!result.ok) {
          throw new Error(result.status === 404 ? "项目不存在。" : "加载项目失败。");
        }
        const project = result.data;
        if (!project || typeof project !== "object") {
          throw new Error("服务器返回异常，请稍后重试。");
        }

        root.className = "";
        root.innerHTML = `
          <img class="cover" src="${escapeHtml(project.coverImage)}" alt="${escapeHtml(project.title)}"
               referrerpolicy="no-referrer" onerror="this.style.display='none'">
          ${renderVideo(project.videoUrl)}
          <article>
            <div class="meta">${escapeHtml(project.date || "未设置日期")}</div>
            <h1>${escapeHtml(project.title)}</h1>
            ${renderTags(project.tags)}
            <div class="summary">${escapeHtml(project.summary)}</div>
            ${renderRepo(project)}
            <div class="content">${project.content}</div>
          </article>
        `;
        buildToc();
        renderMath(root.querySelector(".content"));
        setupPager(project.id);
        currentProjectId = project.id;
        const browseBtn = document.getElementById("browse-source");
        if (browseBtn) browseBtn.addEventListener("click", () => openCodeViewer(project.id));
      } catch (error) {
        root.className = "state";
        root.textContent = error.message;
      }
    }

    // 基于公开列表（已发布、置顶优先、按日期）渲染上一篇/下一篇。
    async function setupPager(currentId) {
      let list;
      try {
        const result = await fetchWithWake(`${API_BASE}/api/projects`);
        if (!result.ok || !Array.isArray(result.data)) return;
        list = result.data;
      } catch {
        return;
      }

      const index = list.findIndex((p) => p.id === currentId);
      if (index === -1 || list.length < 2) return;

      const prev = list[index - 1] || null;
      const next = list[index + 1] || null;
      prevUrl = prev ? `/project/${encodeURIComponent(prev.id)}` : null;
      nextUrl = next ? `/project/${encodeURIComponent(next.id)}` : null;

      const cell = (proj, cls, dir) =>
        proj
          ? `<a class="pager-link ${cls}" href="/project/${encodeURIComponent(proj.id)}"><span class="dir">${dir}</span><span class="ptitle">${escapeHtml(proj.title)}</span></a>`
          : `<span class="pager-empty"></span>`;

      const nav = document.createElement("nav");
      nav.className = "pager";
      nav.innerHTML = cell(prev, "prev", "← 上一篇") + cell(next, "next", "下一篇 →");
      nav.querySelectorAll(".pager-link").forEach((link) => {
        link.addEventListener("click", (event) => {
          event.preventDefault();
          leaveTo(link.getAttribute("href"));
        });
      });

      const hint = document.createElement("p");
      hint.className = "pager-hint";
      hint.textContent = "提示：也可以用键盘 ← / → 翻页";

      const wrap = document.querySelector(".wrap");
      wrap.appendChild(nav);
      wrap.appendChild(hint);
    }

    // ---- 阅读进度条 + 目录 ----
    const progressBar = document.getElementById("progress-bar");
    const tocPanel = document.getElementById("toc-panel");
    const tocFab = document.getElementById("toc-fab");
    const tocBackdrop = document.getElementById("toc-backdrop");
    let headings = [];
    let tocLinks = [];

    function openDrawer() {
      tocPanel.classList.add("open");
      tocBackdrop.classList.add("open");
    }
    function closeDrawer() {
      tocPanel.classList.remove("open");
      tocBackdrop.classList.remove("open");
    }
    tocFab.addEventListener("click", openDrawer);
    tocBackdrop.addEventListener("click", closeDrawer);

    function updateOnScroll() {
      const docH = document.documentElement.scrollHeight - window.innerHeight;
      const progress = docH > 0 ? window.scrollY / docH : 0;
      progressBar.style.width = `${Math.max(0, Math.min(1, progress)) * 100}%`;

      if (headings.length) {
        let activeId = headings[0].id;
        for (const heading of headings) {
          if (heading.getBoundingClientRect().top <= 110) activeId = heading.id;
          else break;
        }
        tocLinks.forEach((link) => link.classList.toggle("active", link.dataset.target === activeId));
      }
    }

    let ticking = false;
    function onScroll() {
      if (!ticking) {
        requestAnimationFrame(() => { updateOnScroll(); ticking = false; });
        ticking = true;
      }
    }
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll);

    function buildToc() {
      const content = document.querySelector(".content");
      if (!content) return;
      headings = Array.from(content.querySelectorAll("h1, h2, h3")).filter((h) => !h.closest("nav.toc"));
      if (headings.length < 2) {
        updateOnScroll();
        return;
      }
      headings.forEach((heading, i) => {
        if (!heading.id) heading.id = `sec-${i}`;
      });
      tocPanel.innerHTML =
        '<button class="toc-close" type="button" aria-label="关闭目录">×</button>' +
        '<div class="toc-title">目录</div>' +
        headings
          .map(
            (heading) =>
              `<a class="toc-link${heading.tagName === "H3" ? " lvl-3" : ""}" href="#${heading.id}" data-target="${heading.id}">${escapeHtml(heading.textContent || "")}</a>`
          )
          .join("");
      tocLinks = Array.from(tocPanel.querySelectorAll(".toc-link"));
      tocPanel.classList.add("show");
      tocFab.classList.add("show");
      tocPanel.addEventListener("click", (event) => {
        if (event.target.closest(".toc-close")) {
          closeDrawer();
          return;
        }
        const link = event.target.closest("a[data-target]");
        if (!link) return;
        event.preventDefault();
        const target = document.getElementById(link.dataset.target);
        if (target) {
          target.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
          history.replaceState(null, "", `#${link.dataset.target}`);
        }
        closeDrawer();
      });
      updateOnScroll();
    }

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") { closeDrawer(); cvClose(); }
      if (event.target && /^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName)) return;
      if (event.key === "ArrowLeft" && prevUrl) leaveTo(prevUrl);
      if (event.key === "ArrowRight" && nextUrl) leaveTo(nextUrl);
    });

    document.querySelector(".back").addEventListener("click", (event) => {
      event.preventDefault();
      leaveTo(event.currentTarget.getAttribute("href"));
    });

    // ---- 站内只读源码浏览 ----
    let currentProjectId = null;
    let cvEntries = [];
    let cvTreeRoot = null;
    let cvTreeLoaded = false;
    let cvActivePath = null;
    const cvOverlay = document.getElementById("cv-overlay");
    const cvFilesEl = document.getElementById("cv-files");
    const cvFilterEl = document.getElementById("cv-filter");
    const cvCodeEl = document.getElementById("cv-code");
    const cvPathEl = document.getElementById("cv-path");
    const cvTitleEl = document.getElementById("cv-title");

    function cvClose() { cvOverlay.classList.remove("open"); }

    // 由扁平的路径列表构建文件树
    function buildCvTree(entries) {
      const root = { name: "", path: "", type: "dir", children: {} };
      entries.forEach((entry) => {
        const parts = String(entry.path || "").split("/").filter(Boolean);
        let node = root;
        parts.forEach((part, i) => {
          const isLast = i === parts.length - 1;
          if (!node.children[part]) {
            node.children[part] = {
              name: part,
              path: parts.slice(0, i + 1).join("/"),
              type: isLast ? entry.type : "dir",
              children: {},
            };
          }
          node = node.children[part];
        });
      });
      return root;
    }

    // 文件夹在前、文件在后，各自按名称排序
    function cvSortedChildren(node) {
      return Object.values(node.children).sort((a, b) => {
        if (a.type !== b.type) return a.type === "dir" ? -1 : 1;
        return a.name.localeCompare(b.name, "zh");
      });
    }

    // 筛选时需要显示的节点路径集合（命中的文件 + 其所有上级目录）
    function cvMatchSet(filter) {
      const f = filter.toLowerCase();
      const set = new Set();
      cvEntries.forEach((entry) => {
        if (entry.type !== "file" || !entry.path.toLowerCase().includes(f)) return;
        let acc = "";
        entry.path.split("/").forEach((part) => {
          acc = acc ? `${acc}/${part}` : part;
          set.add(acc);
        });
      });
      return set;
    }

    function cvRenderNode(node, depth, opts) {
      let html = "";
      cvSortedChildren(node).forEach((child) => {
        if (opts.matchSet && !opts.matchSet.has(child.path)) return;
        const pad = depth * 14 + 10;
        const safePath = escapeHtml(child.path);
        const safeName = escapeHtml(child.name);
        if (child.type === "dir") {
          const open = opts.forceOpen || depth === 0;
          html += `<div class="cv-row cv-dir${open ? " open" : ""}" data-path="${safePath}" style="padding-left:${pad}px">`
            + `<span class="cv-twisty">▶</span><span class="cv-icon">📁</span><span class="cv-name">${safeName}</span></div>`;
          html += `<div class="cv-children${open ? " open" : ""}">${cvRenderNode(child, depth + 1, opts)}</div>`;
        } else {
          html += `<button type="button" class="cv-row cv-file" data-path="${safePath}" title="${safePath}" style="padding-left:${pad}px">`
            + `<span class="cv-twisty"></span><span class="cv-icon">📄</span><span class="cv-name">${safeName}</span></button>`;
        }
      });
      return html;
    }

    function renderCvFileList(filter) {
      if (!cvTreeRoot) return;
      const f = (filter || "").trim();
      const html = f
        ? cvRenderNode(cvTreeRoot, 0, { matchSet: cvMatchSet(f.toLowerCase()), forceOpen: true })
        : cvRenderNode(cvTreeRoot, 0, { matchSet: null, forceOpen: false });
      cvFilesEl.innerHTML = html || "<div class='cv-empty'>无匹配文件</div>";
      if (cvActivePath) {
        cvFilesEl.querySelectorAll(".cv-file").forEach((b) => {
          if (b.dataset.path === cvActivePath) b.classList.add("active");
        });
      }
    }

    // 根据文件名/扩展名推断 highlight.js 语言
    function cvLanguageFor(path) {
      const name = (path.split("/").pop() || "").toLowerCase();
      if (name === "dockerfile") return "dockerfile";
      if (name === "makefile" || name === "gnumakefile") return "makefile";
      const ext = name.includes(".") ? name.split(".").pop() : "";
      const map = {
        js: "javascript", mjs: "javascript", cjs: "javascript", jsx: "javascript",
        ts: "typescript", tsx: "typescript", py: "python", rb: "ruby", go: "go",
        rs: "rust", java: "java", kt: "kotlin", swift: "swift", scala: "scala",
        c: "c", h: "c", cpp: "cpp", cc: "cpp", cxx: "cpp", hpp: "cpp", hh: "cpp", cs: "csharp",
        php: "php", sh: "bash", bash: "bash", zsh: "bash", ps1: "powershell",
        json: "json", xml: "xml", html: "xml", htm: "xml", svg: "xml", vue: "xml",
        css: "css", scss: "scss", sass: "scss", less: "less",
        yml: "yaml", yaml: "yaml", toml: "ini", ini: "ini", cfg: "ini", conf: "ini",
        md: "markdown", markdown: "markdown", sql: "sql", lua: "lua", r: "r",
        pl: "perl", pm: "perl", diff: "diff", patch: "diff",
      };
      return map[ext] || "";
    }

    // 显示源码：highlight.js 可用则按语言高亮，加载失败/不支持时降级为纯文本
    function cvShowCode(content, path) {
      const text = content || "";
      if (!text) { cvCodeEl.textContent = "（空文件）"; cvCodeEl.scrollTop = 0; return; }
      if (window.hljs) {
        try {
          const lang = cvLanguageFor(path);
          const result = (lang && hljs.getLanguage(lang))
            ? hljs.highlight(text, { language: lang, ignoreIllegals: true })
            : hljs.highlightAuto(text);
          cvCodeEl.innerHTML = result.value;
          cvCodeEl.scrollTop = 0;
          return;
        } catch (e) { /* 降级为纯文本 */ }
      }
      cvCodeEl.textContent = text;
      cvCodeEl.scrollTop = 0;
    }

    async function openCodeViewer(id) {
      cvOverlay.classList.add("open");
      if (cvTreeLoaded) return;
      cvFilesEl.innerHTML = "<div class='cv-loading'>正在加载文件树…</div>";
      try {
        const res = await fetch(`${API_BASE}/api/projects/${encodeURIComponent(id)}/repo/tree`, { headers: accessHeaders() });
        const data = await res.json().catch(() => ({}));
        if (res.status === 401) { window.location.href = "/welcome"; return; }
        if (!res.ok) { cvFilesEl.innerHTML = `<div class='cv-loading'>${escapeHtml(data.message || "加载失败")}</div>`; return; }
        cvTitleEl.textContent = data.repo || "源码浏览";
        cvEntries = (data.entries || []).filter((e) => e && e.path);
        cvTreeRoot = buildCvTree(cvEntries);
        cvTreeLoaded = true;
        renderCvFileList("");
      } catch {
        cvFilesEl.innerHTML = "<div class='cv-loading'>网络异常，请稍后再试。</div>";
      }
    }

    cvFilterEl.addEventListener("input", () => renderCvFileList(cvFilterEl.value.trim()));
    cvFilesEl.addEventListener("click", async (event) => {
      const dirRow = event.target.closest(".cv-dir");
      if (dirRow && cvFilesEl.contains(dirRow)) {
        dirRow.classList.toggle("open");
        const kids = dirRow.nextElementSibling;
        if (kids && kids.classList.contains("cv-children")) kids.classList.toggle("open");
        return;
      }
      const btn = event.target.closest(".cv-file");
      if (!btn) return;
      cvFilesEl.querySelectorAll(".cv-file.active").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      const path = btn.dataset.path;
      cvActivePath = path;
      cvPathEl.textContent = path;
      cvCodeEl.textContent = "加载中…";
      try {
        const res = await fetch(
          `${API_BASE}/api/projects/${encodeURIComponent(currentProjectId)}/repo/file?path=${encodeURIComponent(path)}`,
          { headers: accessHeaders() }
        );
        const data = await res.json().catch(() => ({}));
        if (res.status === 401) { window.location.href = "/welcome"; return; }
        if (!res.ok) { cvCodeEl.textContent = data.message || "读取失败"; return; }
        if (data.tooLarge) { cvCodeEl.textContent = `（文件过大，约 ${Math.round((data.size || 0) / 1024)} KB，未显示）`; return; }
        if (data.binary) { cvCodeEl.textContent = "（二进制文件，无法预览）"; return; }
        cvShowCode(data.content, path);
      } catch {
        cvCodeEl.textContent = "网络异常，请稍后再试。";
      }
    });
    document.getElementById("cv-close").addEventListener("click", cvClose);
    cvOverlay.addEventListener("click", (event) => { if (event.target === cvOverlay) cvClose(); });

    loadProject();
  </script>
  <script src="/assistant.js" defer></script>
</body>
</html>
