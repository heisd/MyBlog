<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目详情</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --paper: #ffffff;
      --ink: #1f2328;
      --muted: #606a75;
      --line: #e2e8f0;
      --accent: #185adb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(180deg, #f8fafc 0%, var(--bg) 100%);
      color: var(--ink);
    }
    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 32px 24px 60px;
    }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
      margin-bottom: 20px;
    }
    .cover {
      width: 100%;
      height: min(46vw, 420px);
      object-fit: cover;
      border-radius: 26px;
      border: 1px solid var(--line);
      box-shadow: 0 20px 44px rgba(15, 23, 42, 0.08);
      margin-bottom: 28px;
    }
    article {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 26px;
      padding: 36px;
      box-shadow: 0 18px 42px rgba(15, 23, 42, 0.05);
    }
    .meta {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 10px;
    }
    h1 {
      margin: 0 0 18px;
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1.08;
    }
    .summary {
      font-size: 1.08rem;
      line-height: 1.8;
      color: var(--muted);
      border-left: 4px solid #dbeafe;
      padding-left: 18px;
      margin-bottom: 30px;
    }
    .content {
      line-height: 1.9;
      color: #313944;
    }
    .content h3 {
      margin-top: 28px;
      margin-bottom: 10px;
      font-size: 1.25rem;
    }
    .video-panel {
      margin-bottom: 28px;
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 20px;
    }
    .video-panel h2 {
      margin: 0 0 14px;
      font-size: 1.2rem;
    }
    .video-frame,
    .video-player {
      width: 100%;
      border: none;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      aspect-ratio: 16 / 9;
    }
    .state {
      background: white;
      border: 1px dashed var(--line);
      border-radius: 18px;
      padding: 24px;
      color: var(--muted);
    }
    @media (max-width: 640px) {
      article {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="back" href="/projects">← 返回项目列表</a>
    <div id="project-root" class="state">正在加载项目...</div>
  </main>

  <script>
    const API_BASE = "https://myblogbackend-njns.onrender.com";

    function getProjectId() {
      const params = new URLSearchParams(window.location.search);
      const queryId = params.get("id");
      if (queryId) return queryId;

      const parts = window.location.pathname.split("/").filter(Boolean);
      return parts[parts.length - 1];
    }

    function escapeHtml(text) {
      return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function renderVideo(videoUrl) {
      if (!videoUrl) return "";

      const safeUrl = escapeHtml(videoUrl);
      const isDirectVideo = /\.(mp4|webm|ogg)(\?.*)?$/i.test(videoUrl);

      if (isDirectVideo) {
        return `
          <section class="video-panel">
            <h2>项目演示视频</h2>
            <video class="video-player" controls playsinline src="${safeUrl}"></video>
          </section>
        `;
      }

      return `
        <section class="video-panel">
          <h2>项目演示视频</h2>
          <iframe
            class="video-frame"
            src="${safeUrl}"
            title="项目演示视频"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
          </iframe>
        </section>
      `;
    }

    async function loadProject() {
      const root = document.getElementById("project-root");
      const id = getProjectId();

      try {
        const response = await fetch(`${API_BASE}/api/projects/${id}`);
        if (!response.ok) {
          throw new Error(response.status === 404 ? "项目不存在。" : "加载项目失败。");
        }
        const project = await response.json();

        root.className = "";
        root.innerHTML = `
          <img class="cover" src="${project.coverImage}" alt="${project.title}">
          ${renderVideo(project.videoUrl)}
          <article>
            <div class="meta">${project.date || "未设置日期"}</div>
            <h1>${project.title}</h1>
            <div class="summary">${project.summary}</div>
            <div class="content">${project.content}</div>
          </article>
        `;
      } catch (error) {
        root.className = "state";
        root.textContent = error.message;
      }
    }

    loadProject();
  </script>
</body>
</html>
