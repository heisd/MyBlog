<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>机器人技术博客</title>
  <style>
    :root {
      --bg: #f5f1e8;
      --paper: #fffdf8;
      --ink: #1f1f1f;
      --muted: #6a625b;
      --accent: #d86d2a;
      --accent-dark: #9f4716;
      --line: #e6ded2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(216,109,42,0.15), transparent 25%),
        linear-gradient(180deg, #f6f1e9 0%, var(--bg) 100%);
    }
    .hero {
      max-width: 1100px;
      margin: 0 auto;
      padding: 72px 24px 48px;
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 32px;
      min-height: 100vh;
      align-items: center;
    }
    .eyebrow {
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--accent-dark);
      font-size: 12px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: clamp(2.8rem, 6vw, 5.3rem);
      line-height: 0.95;
      margin: 0 0 20px;
      max-width: 8ch;
    }
    p {
      font-size: 1.05rem;
      line-height: 1.9;
      color: var(--muted);
      max-width: 60ch;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 28px;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 22px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }
    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(31, 31, 31, 0.1);
    }
    .button-primary {
      background: var(--accent);
      color: white;
    }
    .button-secondary {
      color: var(--ink);
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.75);
    }
    .panel {
      background: rgba(255,253,248,0.82);
      border: 1px solid rgba(230,222,210,0.95);
      border-radius: 28px;
      padding: 26px;
      box-shadow: 0 24px 60px rgba(53, 41, 30, 0.08);
      backdrop-filter: blur(4px);
    }
    .panel h2 {
      margin-top: 0;
      font-size: 1.3rem;
    }
    .panel ul {
      padding-left: 18px;
      margin: 0;
      color: var(--muted);
      line-height: 1.8;
    }
    @media (max-width: 860px) {
      .hero {
        grid-template-columns: 1fr;
        min-height: auto;
        padding-top: 48px;
      }
    }
  </style>
</head>
<body>
  <main class="hero">
    <section>
      <div class="eyebrow">Personal Robotics Lab</div>
      <h1>机器人、视觉与嵌入式 AI 笔记</h1>
      <p>这是我的个人技术博客，用来记录机器人控制、计算机视觉、嵌入式系统与 AI 项目的设计、实现和总结。你可以浏览项目归档、查看完整文章，也可以登录后台管理内容。现在项目详情还支持插入演示视频。</p>
      <div class="actions">
        <a class="button button-primary" href="/projects">浏览项目</a>
        <a class="button button-secondary" href="/admin-login">后台登录</a>
      </div>
    </section>
    <aside class="panel">
      <h2>当前站点能力</h2>
      <ul>
        <li>前端部署在 Vercel，支持公网访问</li>
        <li>后端部署在 Render，提供项目 CRUD 接口</li>
        <li>项目数据保存在 Supabase</li>
        <li>后台支持新增、编辑、删除项目</li>
        <li>项目详情支持插入演示视频</li>
      </ul>
    </aside>
  </main>
</body>
</html>
